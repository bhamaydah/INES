<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الاستراتيجية الوطنية للتربية والتعليم في العراق 2022–2031</title>
<meta name="description" content="الاستراتيجية الوطنية للتربية والتعليم في العراق 2022–2031">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
:root{
  --ink:#1f3e31; --ink-2:#132e21; --lime:#d4e9b0; --lime-2:#e8f3d6; --sage:#5e8f6e; --olive:#81935d;
  --bg:#f6f9f1; --surface:#ffffff; --line:#d9e4cf; --text:#1b2a22; --muted:#5b6d61;
  --on-ink:#f2f8ea; --chip:#eaf2df;
  --ok:#2f7d4f; --ok-bg:#dcefe2; --warn:#a36a00; --warn-bg:#fbeccb; --bad:#b23a2e; --bad-bg:#f8dcd8; --done:#1f5f7a; --done-bg:#d8eaf2; --idle:#6b7a70; --idle-bg:#e8ece6;
  --ge:#8b3220; --tv:#4a5877; --he:#f3ae1d; --he-ink:#3b2a05; --t-blue:#dcebf7; --t-amber:#fde6a8; --t-green:#dcefd2; --sec-green:#3d8a5b; --tile:#9cbfa8; --tile-2:#b9d6c1;
  --font:"TheSans Arabic","IBM Plex Sans Arabic","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#d4e9b0; --ink-2:#0c1a13; --lime:#284a39; --lime-2:#1a3327; --sage:#8fbf9c; --olive:#aab98a;
    --ge:#e0826d; --tv:#9fb0d4; --he:#f3ae1d; --he-ink:#2a1e03; --t-blue:#1d3140; --t-amber:#3b3018; --t-green:#1f3526; --sec-green:#8fcf9f; --tile:#3f6a53; --tile-2:#2f5240;
    --ge:#e0826d; --tv:#9fb0d4; --he:#f3ae1d; --he-ink:#2a1e03; --t-blue:#1d3140; --t-amber:#3b3018; --t-green:#1f3526; --sec-green:#8fcf9f; --tile:#3f6a53; --tile-2:#2f5240;
  --bg:#0f1d16; --surface:#16281f; --line:#2a4334; --text:#e5eedc; --muted:#a3b5a8;
    --on-ink:#12241b; --chip:#213a2d;
    --ok:#7fd19e; --ok-bg:#1f3d2b; --warn:#f2c267; --warn-bg:#3d3119; --bad:#f19a8f; --bad-bg:#43231f; --done:#8dcbe6; --done-bg:#1b3440; --idle:#a7b3aa; --idle-bg:#25322b;
  }
}
:root[data-theme="dark"]{
  --ink:#d4e9b0; --ink-2:#0c1a13; --lime:#284a39; --lime-2:#1a3327; --sage:#8fbf9c; --olive:#aab98a;
  --bg:#0f1d16; --surface:#16281f; --line:#2a4334; --text:#e5eedc; --muted:#a3b5a8;
  --on-ink:#12241b; --chip:#213a2d;
  --ok:#7fd19e; --ok-bg:#1f3d2b; --warn:#f2c267; --warn-bg:#3d3119; --bad:#f19a8f; --bad-bg:#43231f; --done:#8dcbe6; --done-bg:#1b3440; --idle:#a7b3aa; --idle-bg:#25322b;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.8}
.app{min-height:100vh}
a{color:inherit}
h1,h2,h3,h4{line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink-2);color:#eef6e4}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.25}
.brand b{font-weight:700;font-size:17px}
.brand span{font-size:12.5px;color:#b9d49a;letter-spacing:.02em}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
.nav a{text-decoration:none;padding:7px 14px;border-radius:999px;font-size:15px;color:#dbe8cf}
.nav a:hover{background:rgba(212,233,176,.12)}
.nav a[aria-current="page"]{background:#d4e9b0;color:#132e21;font-weight:600}

/* hero */
.hero{background:var(--ink-2);color:#eef6e4;padding-block:48px 0}
.hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;align-items:end}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:700;line-height:1.2}
.hero .years{display:inline-block;margin-top:14px;background:#d4e9b0;color:#1f3e31;font-weight:600;font-size:clamp(22px,3vw,32px);padding:4px 22px;border-radius:4px}
.hero .lead{margin-top:22px;font-size:18px;color:#cfe0bf;max-width:58ch;font-weight:300}
.vision{background:#d4e9b0;color:#132e21;border-start-start-radius:72px;padding:30px 32px 34px;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end}
.vision small{font-weight:600;letter-spacing:.04em;color:#3d5e4b}
.vision p{font-size:20px;font-weight:500;margin-top:8px}
.strip{background:var(--lime);height:22px;margin-top:40px}

/* sections */
main{padding-block:40px 64px}
.sec{margin-top:52px}
.sec:first-child{margin-top:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--sage);letter-spacing:.05em}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{font-size:clamp(24px,3vw,32px);color:var(--ink);font-weight:700}
.sec-h p{color:var(--muted);max-width:60ch}
.prose{max-width:68ch}
.prose p+p{margin-top:12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:20px 22px}
.stat b{display:block;font-size:30px;font-weight:700;color:var(--ink);line-height:1.2}
.stat span{display:block;color:var(--muted);font-size:14.5px;margin-top:6px;line-height:1.6}

.subsectors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ss{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.ss.alt{background:var(--ink);color:var(--on-ink);border-color:var(--ink);border-start-start-radius:48px}
.ss h3{font-size:21px}
.ss .goal{font-size:15.5px;opacity:.92}
.ss ol{margin:0;padding-inline-start:22px;font-size:15px}
.ss .k{font-size:12.5px;font-weight:600;letter-spacing:.04em;opacity:.75}

.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.chap{display:flex;gap:14px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:border-color .15s, transform .15s}
.chap:hover{border-color:var(--sage);transform:translateY(-2px)}
.chap .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:18px}
.chap b{display:block;font-weight:600;line-height:1.5;color:var(--ink)}
.chap small{color:var(--muted);font-size:13.5px}

.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:3px solid var(--ink);margin-top:8px}
.tl{padding:16px 0 0 16px;position:relative}
.tl::before{content:"";position:absolute;top:-10px;inset-inline-start:0;width:17px;height:17px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.tl.now::before{background:var(--lime);border-color:var(--sage)}
.tl b{display:block;font-size:20px;color:var(--ink);padding-top:6px}
.tl span{color:var(--muted);font-size:14.5px;display:block;padding-inline-end:12px}

/* chapter page */
.page-head{background:var(--ink-2);color:#eef6e4;padding-block:36px 30px}
.page-head .crumb{font-size:14px;color:#b9d49a}
.page-head .crumb a{color:#b9d49a}
.page-head h1{font-size:clamp(26px,4vw,42px);margin-top:8px;max-width:30ch}
.page-head p{color:#cfe0bf;margin-top:10px;max-width:70ch;font-weight:300}
.layout{display:grid;grid-template-columns:230px 1fr;gap:40px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:2px;font-size:14.5px}
.toc a{text-decoration:none;padding:7px 12px;border-radius:8px;color:var(--muted);border-inline-start:3px solid transparent}
.toc a:hover{background:var(--chip);color:var(--text)}
.toc a.on{border-inline-start-color:var(--sage);color:var(--ink);font-weight:600;background:var(--chip)}
.content h2{font-size:25px;color:var(--ink);margin-bottom:12px}
.content h3{font-size:19px;color:var(--ink);margin-block:18px 8px}
.content ul{padding-inline-start:22px;margin:8px 0}
.content li+li{margin-top:4px}
.block{margin-top:40px;scroll-margin-top:90px}
.block:first-child{margin-top:0}
.callout{background:var(--lime-2);border-start-start-radius:32px;padding:22px 26px;margin-block:16px}
.callout b{color:var(--ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-block:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--chip);color:var(--ink);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.src{font-size:13px;color:var(--muted);margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{text-decoration:none;display:flex;flex-direction:column;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:48%}
.pager a small{color:var(--muted)}
.pager a b{color:var(--ink);font-weight:600}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 18px;border-radius:999px;cursor:pointer;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-weight:600}
.pillar{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:16px;overflow:hidden}
.pillar-h{padding:18px 22px;background:var(--lime-2);display:grid;grid-template-columns:auto 1fr;gap:4px 16px}
.pillar-h .pn{grid-row:span 2;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:19px}
.pillar-h h3{margin:0;font-size:19px}
.pillar-h p{color:var(--muted);font-size:15px}
.progs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--line)}
.prog{background:var(--surface);padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.prog-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.prog h4{font-size:16px;color:var(--ink);font-weight:600}
.prog p{font-size:14.5px;color:var(--muted)}
.prog ul{font-size:14.5px;margin:2px 0 0;padding-inline-start:18px}
.toc-box{font-size:14.5px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-top:14px}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;line-height:1.8}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-not_started{color:var(--idle);background:var(--idle-bg)}
.s-on_track{color:var(--ok);background:var(--ok-bg)}
.s-at_risk{color:var(--warn);background:var(--warn-bg)}
.s-off_track{color:var(--bad);background:var(--bad-bg)}
.s-achieved{color:var(--done);background:var(--done-bg)}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:99px}

/* tracking */
.notice{display:flex;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--sage);border-radius:10px;padding:14px 18px;font-size:15px}
.notice.warn{border-inline-start-color:var(--warn)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-block:18px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sum b{font-size:28px;display:block;line-height:1.2}
.sum span{font-size:14px}
.bysec{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bysec .sum b{font-size:22px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-block:20px 10px}
.filters select,.filters input{font:inherit;font-size:15px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.kpi-group h3{font-size:18px;color:var(--ink);margin-block:26px 10px}
.kpis{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:14px;align-items:center;padding:14px 18px}
.kpi .name b{font-weight:600;display:block;line-height:1.55}
.kpi .name small{color:var(--muted);font-size:13px}
.kpi .cell small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.kpi .cell div{font-weight:600;font-variant-numeric:tabular-nums;line-height:1.5}
.kpi .note{font-size:13.5px;color:var(--muted);grid-column:1/-1;margin-top:-6px}
.btn{font:inherit;font-size:14.5px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:13px}

dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--text);box-shadow:0 24px 60px rgba(10,30,20,.35)}
dialog::backdrop{background:rgba(8,20,14,.55)}
.dlg-h{background:var(--ink-2);color:#eef6e4;padding:18px 22px}
.dlg-h small{color:#b9d49a}
.dlg-b{padding:20px 22px;display:grid;gap:14px}
.dlg-b label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--ink)}
.dlg-b input,.dlg-b select,.dlg-b textarea{font:inherit;font-weight:400;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);width:100%}
.dlg-b textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-f{display:flex;gap:10px;justify-content:flex-start;padding:0 22px 20px;align-items:center;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px}

/* partners */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.partner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.partner h3{font-size:18px;color:var(--ink)}
.partner .tag{align-self:flex-start;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--sage);padding:1px 10px;border-radius:99px}
.partner ul{margin:0;padding-inline-start:18px;font-size:15px}
.govern{display:grid;gap:10px}
.gov-row{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:stretch}
.gov-row .lvl{background:var(--ink);color:var(--on-ink);border-radius:10px;padding:12px 14px;font-weight:600;display:flex;align-items:center}
.gov-row .boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gov-row .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
.gov-row .box b{display:block;color:var(--ink)}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--font);font-size:12px}
.chart .v{fill:var(--text);font-weight:600}


/* Figure ES1 — programmatic overview */
.overview{border:1.5px solid var(--sec-green);border-radius:16px;padding:22px 22px 16px;background:var(--surface)}
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ov-col{display:flex;flex-direction:column;gap:10px}
.ov-col h3{text-align:center;font-size:19px;min-height:2.7em;display:flex;align-items:end;justify-content:center}
.ov-goal{border-radius:18px;border-start-start-radius:0;padding:18px;font-weight:600;font-size:15px;min-height:150px;display:flex;align-items:center;line-height:1.7}
.ov-item{border:1.5px solid;border-radius:12px;border-start-start-radius:0;padding:6px 12px;font-size:14.5px;background:var(--surface);display:flex;gap:8px}
.ov-item b{font-variant-numeric:tabular-nums}
.c-ge h3{color:var(--ge)} .c-ge .ov-goal{background:var(--ge);color:#fff} .c-ge .ov-item{border-color:var(--ge)}
.c-tv h3{color:var(--tv)} .c-tv .ov-goal{background:var(--tv);color:#fff} .c-tv .ov-item{border-color:var(--tv)}
.c-he h3{color:#c98a06} .c-he .ov-goal{background:var(--he);color:var(--he-ink)} .c-he .ov-item{border-color:var(--he)}
.ov-cap{margin-top:14px;color:var(--sec-green);font-weight:700;font-size:16px}
.ov-mins{font-size:13px;color:var(--muted);text-align:center}

/* Figure 1.1 — component tiles */
.comp{border:1.5px solid var(--sec-green);border-radius:18px;padding:22px;background:var(--surface)}
.comp h3{text-align:center;color:var(--ink);font-size:18px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.tile .ic{width:84px;height:84px;background:var(--tile);border-radius:0 30px 30px 30px;display:grid;place-items:center}
.tile:nth-child(odd) .ic{background:var(--tile-2)}
.tile .ic svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:15px;color:var(--ink);min-height:2.9em;display:flex;align-items:center}
.tile .cnt{border-top:2px solid var(--tile-2);border-bottom:2px solid var(--tile-2);width:100%;padding-block:4px;font-size:14px;line-height:1.6}

/* Theory of change */
.toc-fig{border:1.5px solid var(--sec-green);border-radius:18px;padding:22px;background:var(--surface);margin-top:18px}
.toc-fig > h3{color:var(--ge);font-size:21px;margin-bottom:14px}
.toc-fig.tv > h3{color:var(--tv)} .toc-fig.he > h3{color:#b87d04}
.tr{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:stretch;margin-top:12px}
.tr .lab{color:var(--muted);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;border-inline-end:2px solid var(--line);padding-inline-end:8px;line-height:1.5}
.tr .res{font-weight:600;color:var(--ge);font-size:15.5px;display:flex;align-items:center}
.toc-fig.tv .tr .res{color:var(--tv)} .toc-fig.he .tr .res{color:#9c6a03}
.kpibox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpibox ul{margin:0;border:1.5px solid var(--ge);border-radius:14px;border-start-start-radius:0;padding:10px 30px 10px 14px;font-size:14px}

.pobj{border-radius:20px;border-start-start-radius:0;padding:14px 16px;font-size:14.5px;line-height:1.7}
.psub{border:1.5px solid;border-radius:14px;border-start-start-radius:0;padding:10px 14px;font-size:14px;background:var(--surface)}
.psub ul{margin:0;padding-inline-start:18px}
.psub .upd{margin-top:6px;color:var(--muted);font-size:13px}
.k0 .ph{color:#3a88c9} .k0 .pobj{background:var(--t-blue)} .k0 .psub{border-color:#9cc5e8}
.k1 .ph{color:#c98a06} .k1 .pobj{background:var(--t-amber)} .k1 .psub{border-color:#f2cf73}
.k2 .ph{color:var(--sec-green)} .k2 .pobj{background:var(--t-green)} .k2 .psub{border-color:#a7d49a}
@media (max-width:900px){
  .ov-grid{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tr{grid-template-columns:1fr}
  .tr .lab{border-inline-end:0;border-bottom:2px solid var(--line);justify-content:flex-start;padding-bottom:4px}
  .kpibox{grid-template-columns:1fr}
}

/* icon tiles (strategy style) */
.ic{flex:none;width:64px;height:64px;background:var(--tile);border-radius:24px;border-start-start-radius:0;display:inline-grid;place-items:center}
.ic svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:40px;height:40px;border-radius:15px;border-start-start-radius:0}
.ic.sm svg{width:23px;height:23px}
.ic.big{width:78px;height:78px;background:#d4e9b0;border-radius:28px;border-start-start-radius:0}
.ic.big svg{stroke:#1f3e31;width:42px;height:42px}
.nav-admin{border:1px solid rgba(212,233,176,.45)}
.ph-row{display:flex;gap:22px;align-items:center}
/* doc tiles */
.dgroup{margin-top:26px}
.dg-h{font-size:17px;color:var(--sage);margin-bottom:12px}
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.dtiles.front{grid-template-columns:repeat(5,1fr)}
.dtile{text-decoration:none;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;border-start-start-radius:0;padding:18px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,box-shadow .15s}
.dtile:hover{border-color:var(--sec-green);transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,62,49,.10)}
.dtile .ic{margin-bottom:6px}
.dtile.front .ic{background:var(--tile-2)}
.dt-k{font-size:12.5px;font-weight:600;color:var(--sage)}
.dtile b{color:var(--ink);font-size:16.5px;line-height:1.5}
.dtile small{color:var(--muted);font-size:13.5px;line-height:1.6}
.toc-h{font-size:12.5px;font-weight:700;color:var(--sage);padding:10px 12px 2px}
/* metrics under each sector */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-block:4px 6px}
.metric{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.metric b{font-size:20px;line-height:1.2;margin-top:4px}
.metric span{font-size:11.5px;color:var(--muted);line-height:1.35}
.c-ge .metric .ic{background:var(--ge)} .c-tv .metric .ic{background:var(--tv)} .c-he .metric .ic{background:var(--he)}
.c-ge .metric b{color:var(--ge)} .c-tv .metric b{color:var(--tv)} .c-he .metric b{color:#c98a06}
a.ov-item{text-decoration:none;color:var(--text);align-items:center;transition:background .15s}
a.ov-item i{margin-inline-start:auto;font-style:normal;font-size:20px;line-height:1;opacity:.5}
.c-ge a.ov-item:hover{background:var(--ge);color:#fff} .c-tv a.ov-item:hover{background:var(--tv);color:#fff} .c-he a.ov-item:hover{background:var(--he);color:var(--he-ink)}
.ov-cap small{font-weight:400;color:var(--muted);font-size:13px}
/* pillar page */
.sec-ge{background:#5e1f13} .sec-tv{background:#2f3a52} .sec-he{background:#6b4a06}
.pchips{display:grid;gap:8px;margin-bottom:6px}
.pchip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-name{font-size:13px;font-weight:700;min-width:190px}
.c-ge .pc-name{color:var(--ge)} .c-tv .pc-name{color:var(--tv)} .c-he .pc-name{color:#b87d04}
.pchip{text-decoration:none;font-size:13.5px;padding:3px 12px;border:1.5px solid;border-radius:12px;border-start-start-radius:0;display:inline-flex;gap:6px;color:var(--text);background:var(--surface)}
.c-ge .pchip{border-color:var(--ge)} .c-tv .pchip{border-color:var(--tv)} .c-he .pchip{border-color:var(--he)}
.c-ge .pchip.on{background:var(--ge);color:#fff} .c-tv .pchip.on{background:var(--tv);color:#fff} .c-he .pchip.on{background:var(--he);color:var(--he-ink)}

.letter{background:var(--surface);border:1.5px solid var(--sec-green);border-radius:22px;border-start-start-radius:0;padding:26px 30px;max-width:72ch}
.letter p+p{margin-top:14px}
.sign{margin-top:22px;display:flex;flex-direction:column;align-items:flex-end;text-align:end;line-height:1.7}
.sign b{color:var(--ink)} .sign span{color:var(--muted);font-size:14.5px}
.abbr{font-weight:700;color:var(--ink);letter-spacing:.03em}
ul.checks{list-style:none;padding:0;display:grid;gap:8px;max-width:75ch}
ul.checks li{position:relative;padding-inline-start:30px}
ul.checks li::before{content:"";position:absolute;inset-inline-start:0;top:.45em;width:16px;height:16px;border-radius:6px;border-start-start-radius:0;background:var(--tile)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step{background:var(--lime-2);border-radius:20px;border-start-start-radius:0;padding:14px 16px}
.step b{display:block;color:var(--ink);font-size:19px}
.step span{font-size:14.5px}
.principles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pr{border:1.5px solid var(--tile);border-radius:18px;border-start-start-radius:0;padding:14px 18px;background:var(--surface)}
.pr b{display:block;color:var(--ink)} .pr span{font-size:14.5px;color:var(--muted)}
ol.timeline-v{list-style:none;counter-reset:st;padding:0;display:grid;gap:10px;max-width:75ch}
ol.timeline-v li{counter-increment:st;position:relative;padding-inline-start:46px;min-height:34px}
ol.timeline-v li::before{content:counter(st);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:12px;border-start-start-radius:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700}
ol.timeline-v b{color:var(--ink)}
/* login / admin */
.login-wrap{padding-block:56px}
.login{max-width:520px;margin-inline:auto;background:var(--surface);border:1.5px solid var(--sec-green);border-radius:24px;border-start-start-radius:0;overflow:hidden}
.login-h{background:var(--ink-2);color:#eef6e4;padding:22px;display:flex;gap:16px;align-items:center}
.login-h small{color:#b9d49a} .login-h h1{font-size:24px}
.boot{margin:0 22px 16px;padding:14px 16px;background:var(--lime-2);border-radius:14px;font-size:14.5px}
.admin-head{background:#0c2419}
.admin-bar{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn.light{border-color:#d4e9b0;color:#d4e9b0}
.btn.light:hover{background:rgba(212,233,176,.12)}
.grp-h{font-size:22px;margin-top:34px;padding-inline-start:14px;border-inline-start:6px solid var(--ink);color:var(--ink)}
.grp-h.g-ge{border-color:var(--ge)} .grp-h.g-tv{border-color:var(--tv)} .grp-h.g-he{border-color:var(--he)} .grp-h.g-fn{border-color:var(--sage)}
.kpi-group h3 a{color:inherit}
.hist{font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;max-height:140px;overflow:auto}
.hist ul{margin:6px 0 0;padding-inline-start:18px}
.card-form{background:var(--surface);border:1px solid var(--line);border-radius:14px}
@media (max-width:900px){
  .dtiles.front{grid-template-columns:repeat(2,1fr)}
  .steps,.principles{grid-template-columns:1fr 1fr}
  .pc-name{min-width:100%}
}
@media (max-width:480px){ .steps,.principles,.dtiles.front{grid-template-columns:1fr} .metrics{grid-template-columns:repeat(2,1fr)} }

footer{background:var(--ink-2);color:#b9d49a;font-size:14px;padding-block:26px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:900px){
  .hero-grid,.subsectors{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .toc{position:static;flex-direction:row;flex-wrap:wrap}

  .bysec{grid-template-columns:repeat(2,1fr)}
  .kpi{grid-template-columns:1fr 1fr}

  .timeline{grid-template-columns:1fr 1fr;row-gap:24px}
  .gov-row{grid-template-columns:1fr}
}
@media (max-width:480px){
  .nav a{padding:6px 10px;font-size:14px}
  .row2{grid-template-columns:1fr}
  .pager a{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

    {id:"adopt", t:"اعتماد الاستراتيجية السابقة", h:`
      <div class="prose"><p>اعتُمدت الاستراتيجية الوطنية للتربية والتعليم العالي (2012–2022) بقرار مجلس الوزراء رقم (323) لسنة 2012 في جلسته الأربعين بتاريخ 9/11/2012 مرجعاً وطنياً لإعداد الخطط السنوية للوزارات القطاعية. شكّل مكتب رئيس الوزراء أمانة تنفيذية للاستراتيجية في تشرين الثاني 2013، وتضمنت الاستراتيجية 178 مشروعاً: 63 لوزارة التربية و115 لوزارة التعليم العالي والبحث العلمي، إضافة إلى 11 مشروعاً للمنظمات الدولية.</p>
      <p>بسبب هبوط أسعار النفط وتخصيص معظم الموازنة العامة لتحرير المناطق التي احتلها داعش في 2014، عُلّق عمل الأمانة التنفيذية ولم يُنفذ كثير من المشاريع، فشكلت الوزارتان فرقاً فنية خاصة بهما.</p></div>`},
    {id:"components", t:"مكونات الاستراتيجية السابقة", h:`<p class="prose" style="margin-bottom:14px">نفّذ فريق الاستراتيجية ستة مكونات تغطي السياق العام والمؤسسي والتشريعات وجودة التعليم والبحث العلمي وتمويل القطاع: 166 مشروعاً تحقق 71 هدفاً استراتيجياً تقاس بـ120 مؤشراً، معظمها كمي.</p>${componentTiles()}<p class="src">الشكل 1.1: السياق المؤسسي للتعليم في العراق.</p>`},

      ])}`},

    {id:"rates", t:"نسب تنفيذ المشاريع والبرامج", h:`
      <p class="prose">وفق تقرير لجنة متابعة تنفيذ الاستراتيجية (قطاع التعليم العالي)، توزعت نسب تنفيذ 166 مشروعاً وبرنامجاً على النحو الآتي:</p>
      ${barChart(["0%","<20%","20–40%","40–60%","60–80%","80–<100%","100%"],[{name:"عدد المشاريع",color:"var(--sage)",data:[39,20,33,25,17,21,11]}],{max:40,step:10,aria:"توزيع نسب التنفيذ",label:i=>[39,20,33,25,17,21,11][i]})}

    {id:"challenges", t:"التحديات والدروس المستفادة", h:`
      <div class="content"><h3>أبرز التحديات</h3><ul>
        <li>قلة التخصيصات المالية بسبب تراجع الإيرادات الحكومية مع الهبوط الحاد لأسعار النفط.</li>
        <li>الظروف الأمنية الصعبة بعد احتلال داعش لعدد من المحافظات في 2014.</li>
        <li>ضعف الاستقرار السياسي والإداري وتغير القيادات العليا في الوزارتين.</li>
        <li>التوسع الكبير في البرامج والمشاريع وبعضها طموح جداً ويتطلب تمويلاً كبيراً.</li>
        <li>ضعف التنسيق بين الوزارتين والجهات الحكومية الأخرى.</li>
        <li>حداثة التجربة بوصفها أول استراتيجية وطنية شاملة للتعليم.</li>
        <li>القيود الإدارية والقانونية والروتين المعقد.</li>
      </ul>
      <div class="callout"><b>الدروس المستفادة:</b> الاستقرار السياسي والأمني والإداري شرط للتنفيذ؛ تنويع مصادر التمويل بدلاً من الاعتماد على التمويل الحكومي وحده؛ تضمين سيناريوهات وخطط طوارئ؛ فريق عمل مشترك بين الوزارات للتخطيط والمتابعة؛ مراجعة التشريعات المعيقة؛ واقعية الأهداف؛ وتدريب الكوادر المسؤولة عن التنفيذ والمتابعة.</div></div>`}
  ];
},

      <div class="callout" style="background:var(--surface);border:1px solid var(--line)"><b>الرسالة</b><p style="font-size:17px;margin-top:6px">تعزيز المؤسسات التربوية والتعليمية للشراكة المجتمعية، وبناء أنظمة تعزز التفكير العلمي والإبداعي، وتضمن جودة المخرجات بما يلبي احتياجات سوق العمل، ويسهم في بناء اقتصاد معرفي متنوع ينسجم مع متطلبات التنمية المستدامة.</p></div>
      <p class="prose">صيغت الرؤية مع مراعاة الرؤية الشاملة للتنمية الاجتماعية والاقتصادية، وقوانين التعليم بما فيها التعليم الأساسي الإلزامي المجاني، والتزامات العراق وفق الهدف الرابع من أهداف التنمية المستدامة.</p>`},

    {id:"escg", t:"مجموعة تنسيق قطاع التعليم", h:`<div class="prose"><p>أُنشئت مجموعة تنسيق قطاع التعليم في 2019 بوصفها الإطار الرئيس لتنسيق تدخلات الشركاء ومواءمة أموال المانحين مع الموازنات الحكومية ومتابعة التقدم وفق إطار نتائج متفق عليه. ترأسها وزارتا التربية والتعليم العالي، وتشارك في رئاستها المفوضية الأوروبية ومكتب رئيس الوزراء، وتقودها معهما اليونسكو واليونيسف، ويُعاد انتخاب الشركاء الدوليين كل سنتين. تستضيف اليونيسف الأمانة منذ تشرين الثاني 2020 على أن تنتقل إلى وزارة التربية لاحقاً. تدعمها فرق عمل فنية لكل قطاع فرعي وفرق مهام موضوعية.</p></div>

foreword: H => { const {tbl,barChart,overviewFigure,componentTiles} = H;
  return [
    {id:"pm", t:"كلمة السيد رئيس مجلس الوزراء", h:`<div class="letter">
      <p>تتطلع هذه الحكومة ومن خلال منهاجها الطموح إلى خلق نظام تربوي وتعليمي منسجم مع المعايير الدولية المعتمدة، ومستفيد من أفضل الممارسات والتجارب العالمية، مع الحفاظ على القيم الحضارية العراقية الأصيلة والقيم الإنسانية في التسامح والتعايش. ونسعى من خلال هذا النظام إلى تحقيق جملة أهداف أبرزها توفير فرص تعليم وتعلم مستدامة ومبتكرة وذات جودة عالية، فضلاً عن تعزيز بناء مجتمع المعرفة والاستجابة إلى الحاجات الاستراتيجية للبلد وحاجة سوق العمل. كما يتطلع المنهاج الحكومي إلى تعزيز مؤسساتنا التعليمية للشراكة المجتمعية، وبناء أنظمة تعزز التفكير العلمي والإبداعي، وتضمن جودة مخرجات التربية والتعليم، والتي تسهم في بناء اقتصاد معرفي ومتنوع ينسجم مع متطلبات خطط التنمية المستدامة.</p>
      <p>إن التعليم الجيد الذي نطمح إليه سيشكل الدعامة الأساسية والوسيلة لتحقيق أهداف التنمية المستدامة التي أقرتها منظمة الأمم المتحدة حتى عام 2030، من أجل إعداد جيل من الكفاءات الشابة الفاعلة والقادرة على أخذ زمام الأمور نحو التنمية الوطنية الشاملة. وستتركز مهمة الحكومة على الإشراف المباشر على تنفيذ هذه الاستراتيجية الوطنية كما ورد في البند الرابع عشر للمنهاج الحكومي لهذه الدورة، وذلك من خلال الوزارات القطاعية ومن خلال لجنة مركزية تحت إشرافنا وفرق عمل قطاعية تحرص على تنفيذ البرامج والمشاريع التي تبنتها هذه الاستراتيجية. كما تحرص الحكومة على توفير الميزانية اللازمة لتنفيذ ما ورد من فقرات في هذه الاستراتيجية، مع ضرورة الاستمرار بإجراء عملية المتابعة والتقييم لبنود تنفيذها للوقوف على ما تحقق منها ومعالجة الخلل الذي يشوبها أثناء عملية التنفيذ، مع العمل على تذليل الصعاب والتحديات التي تواجهها من خلال استخدام آليات فاعلة وعملية لتحقيق النتائج المرجوة ووفقاً للخطة المرسومة.</p>
      <p>نشكر القائمين على إعداد هذه الاستراتيجية من الوزارات القطاعية المشاركة والخبراء والمنظمات الدولية الداعمة، وبدورنا نتطلع إلى مزيد من العطاء والإخلاص في العمل.</p>
      <p>بارك الله بكل الجهود الخيرة التي أنجزت هذا العمل النبيل والطموح. ومن الله التوفيق.</p>
      <div class="sign"><b>المهندس محمد شياع السوداني</b><span>رئيس مجلس الوزراء</span><span>بغداد – العراق</span></div>
    </div>`}
  ];
},
thanks: H => { const {tbl,barChart,overviewFigure,componentTiles} = H;

    {id:"ack", t:"شكر وتقدير", h:`<div class="letter">
      <p>تتقدم اللجنة العليا المشرفة على إعداد هذه الاستراتيجية وهيئة المستشارين واللجنة العليا لتطوير التعليم في العراق بالشكر والتقدير لكل من ساهم في إنجاز هذا العمل المبارك، ابتداءً من مكتب رئيس مجلس الوزراء إلى الوزارات ذات العلاقة (التربية، والتعليم العالي والبحث العلمي، والتخطيط، والمالية)، وكذلك فرق العمل واللجان الفنية المنبثقة عن اللجنة العليا. والشكر موصول إلى المنظمات الدولية المساهمة والممولة لهذا الإنجاز، خاصة اليونسكو، والمعهد الدولي للتخطيط التربوي، والبنك الدولي، واليونيسف، فضلاً عن الخبراء الدوليين الذين ساهموا في نقل أفضل الممارسات الدولية.</p>
      <p>ندعو الله أن تتمكن حكومتنا الوطنية من تنفيذ برنامجها الطموح الذي أكد في محوره الرابع عشر بشكل واضح على الإشراف المباشر على تنفيذ هذه الاستراتيجية، ومن الله التوفيق.</p>
      <div class="sign"><b>لجنة الأمر الديواني (343)</b><span>المشرفة على إعداد الاستراتيجية الوطنية للتربية والتعليم</span></div>
    </div>`},
    {id:"committees", t:"اللجان وفرق العمل", h:`<div class="prose"><p>شُكّلت اللجنة العليا بموجب الأمر الديواني (343) الصادر عن مكتب رئيس الوزراء في 24/10/2018 برئاسة أ.د. حامد خلف أحمد، نائب رئيس هيئة المستشارين، وعضوية ممثلين عن وزارات التعليم العالي والبحث العلمي، والتربية، والتخطيط، والمالية، ومدير مكتب التربية والثقافة في هيئة المستشارين عضواً ومنسقاً. وشُكّل فريق صياغة الاستراتيجية بموجب الأمر الإداري (36) لسنة 2019، وشكّلت وزارة التعليم العالي لجنة لمراجعة استراتيجية التعليم العالي من 46 عضواً موزعين على ستة فرق عمل متخصصة.</p></div><p style="margin-top:12px"><a class="btn" href="#/partners">عرض الشركاء وأدوارهم</a></p>`}
  ];
},

summary: H => { const {tbl,barChart,overviewFigure,componentTiles} = H;
  return [
    {id:"purpose", t:"الغرض وبنية الوثيقة", h:`<div class="prose"><p>تعكس هذه الوثيقة التحديات الحالية التي يواجهها قطاع التعليم في العراق، وتقدم طريقاً للمضي قدماً. يقدم الفصل الأول غرض الاستراتيجية ويصف عملية إعدادها، ويعرض الفصل الثاني السياق العام، يتبعه تحليل قطاع التعليم في الفصل الثالث. ويوضح الفصل الرابع الرؤية والرسالة والقيم الأساسية، ويصف الفصل الخامس أولويات القطاع والبرامج الرئيسة، ويبيّن الفصل السادس إطار التكلفة والتمويل، ويختتم الفصل السابع بإطار الرصد والتقييم والتنسيق والتنفيذ.</p>
      <p>تشكل الاستراتيجية جزءاً من جهد حكومي واسع لتحسين جودة الخدمات العامة وكفاءتها لجميع العراقيين، وقد صيغت مع مراعاة الرؤية الشاملة للتنمية الاجتماعية والاقتصادية، وقوانين التعليم بما فيها التعليم الأساسي الإلزامي المجاني، والتزامات العراق وفق الهدف الرابع من أهداف التنمية المستدامة.</p></div>`},
    {id:"vm", t:"الرؤية والرسالة والأهداف", h:`<div class="callout"><b>الرؤية:</b> التطلع إلى نظام تعليمي ملتزم بالقيم، يوفر فرص تعلّم مستدامة ومبتكرة وذات جودة عالية للجميع، ويعزز بناء مجتمع المعرفة، ويتوافق مع المعايير العالمية.</div>
      <div class="callout" style="background:var(--surface);border:1px solid var(--line)"><b>الرسالة:</b> تعزيز المؤسسات التربوية والتعليمية للشراكة المجتمعية، وبناء أنظمة تعزز التفكير العلمي والإبداعي، وتضمن جودة المخرجات بما يلبي احتياجات سوق العمل، ويسهم في بناء اقتصاد معرفي متنوع ينسجم مع متطلبات التنمية المستدامة.</div>
      ${overviewFigure("الشكل م.ت 1: نظرة عامة على الاستراتيجيات البرامجية")}`},
    {id:"assump", t:"الافتراضات والتوقعات", h:`<div class="prose"><p><b>تحسن تدريجي مرتبط بالإصلاحات:</b> يُفترض أن تنطلق الإصلاحات الحاسمة في 2022، مع تحسن تدريجي في مؤشرات التعليم خلال السنوات الخمس الأولى، إذ يجب تطبيق الأطر التنظيمية والسياساتية قبل أن يظهر التحسن في الالتحاق والرسوب والاستبقاء. وتعالَج أنظمة تعيين المعلمين وتوزيعهم وكفاءة الإنفاق على البنية التحتية في المرحلة الأولى (2022–2025).</p>
      <p><b>التوقعات الاقتصادية الكلية:</b> متوسط نمو الناتج المحلي 3.3% حتى 2031، وبقاء الإنفاق الحكومي عند نحو 35% من الناتج، وارتفاع حصة التعليم من الإنفاق الحكومي من نحو 10% إلى 16% بحلول 2031. وعليه يرتفع الإنفاق العام على التعليم من نحو 11 تريليون دينار في 2019 إلى 19 تريليون دينار في 2031 (بأسعار 2019 الثابتة)، أي 5.6% من الناتج المحلي.</p></div>`},
    {id:"targets", t:"الأهداف الرئيسية للتعليم", h:`<ul class="checks">
      <li>رفع الالتحاق الإجمالي برياض الأطفال من 10.7% (2018/19) إلى 30% بحلول 2031، مع رفع حصة القطاع الخاص إلى 25%.</li>
      <li>رفع معدل إتمام التعليم الابتدائي إلى 100% بحلول 2025 من نحو 83%، وإتمام المتوسط إلى 100% بحلول 2028 من نحو 62%.</li>
      <li>رفع الالتحاق الإجمالي بالإعدادي العام من 47% إلى 68% للذكور ومن 46% إلى 66% للإناث بحلول 2031.</li>
      <li>توسيع التعليم المهني الإعدادي من 7% / 3% إلى 14% / 13% (ذكور/إناث) بحلول 2031.</li>
      <li>توسع مضبوط في التعليم العالي: التحاق 82% من خريجي الإعدادي العام و50% من خريجي الإعدادي المهني بحلول 2031، مع إبقاء حصة القطاع الخاص عند 25%.</li>
      <li>خفض حجم الصف في رياض الأطفال من 64 إلى 30 وفي الابتدائي من 40 إلى 35.</li>
      <li>رفع المشاركين في برامج التعليم غير النظامي من نحو 70,000 إلى 300,000.</li>
      <li>التغذية المدرسية لجميع تلاميذ الابتدائي الحكومي بحلول 2030، ومنح مدرسية لجميع المدارس الحكومية منذ 2022، وكتب مدرسية ومنح دراسية لـ2% من طلبة الإعدادي و5% من طلبة التعليم العالي.</li>
    </ul>`},

      </div><p class="prose" style="margin-top:14px">تشهد رياض الأطفال والتعليم المهني أكبر زيادة في الكلفة بسبب التوسع المخطط فيهما، وتتطلب فجوة الاستثمار جهوداً كبيرة لتعبئة الموارد.</p>`}

intro: H => { const {tbl,barChart,overviewFigure,componentTiles} = H;

    {id:"why", t:"التعليم ركيزة للتنمية", h:`<div class="prose"><p>تحدد هذه الوثيقة رؤية حكومة العراق لقطاع التعليم للسنوات القادمة. فالتعليم إحدى الركائز الثلاث للتنمية البشرية إلى جانب الصحة والاقتصاد، وركيزة أساسية لاقتصاد المعرفة. والتعليم هو الهدف الرابع من أهداف التنمية المستدامة السبعة عشر، ولا يمكن تحقيق بقية الأهداف دون تحقيقه، وقد جاءت "التنمية البشرية عبر التعليم" أولى الركائز الخمس في أولويات العراق لأهداف التنمية المستدامة 2030، إلى جانب الحكم الرشيد والاقتصاد المتنوع والمجتمع الآمن والبيئة المستدامة.</p></div>`},
    {id:"path", t:"من الاستراتيجية الأولى إلى الحالية", h:`<div class="steps">
      <div class="step"><b class="num">2009</b><span>بدء إعداد أول استراتيجية وطنية للتعليم بمساعدة اليونسكو واليونيسف والبنك الدولي، واستغرق نحو 3 سنوات.</span></div>

      <div class="step"><b class="num">2013–2014</b><span>تشكيل أمانة تنفيذية ثم تعليق عملها بسبب الوضع الأمني والمالي، وتشكيل الوزارتين فرقاً فنية خاصة.</span></div>
      <div class="step"><b class="num">2018</b><span>الأمر الديواني (343) بتشكيل لجنة برئاسة هيئة المستشارين لتقييم الاستراتيجية السابقة وإعداد استراتيجية جديدة لعشر سنوات.</span></div>
    </div>
    <div class="prose" style="margin-top:14px"><p>تراعي الاستراتيجية أهداف الحكومة في تعزيز الهوية الوطنية واللامركزية، والنهوض بالقطاع الخاص، ومعالجة البطالة، وربط المناهج باحتياجات سوق العمل، وتطوير التعليم الأهلي، ومواكبة تكنولوجيا المعلومات والاتصالات، ومعالجة مخلفات داعش وأفكاره الهدامة تربوياً وفكرياً، وتحسين الوضع المالي.</p></div>`},

      <div class="pr"><b>المشاركة</b><span>عملية تشاركية تضمن استشارة أصحاب المصلحة ومراعاة آرائهم.</span></div>
      <div class="pr"><b>وضوح الأدوار</b><span>تحديد مسؤوليات جميع الأطراف، وآليات تشاور فعالة، وجهة القرار النهائي.</span></div>
      <div class="pr"><b>بناء القدرات</b><span>الدعم الفني الدولي نشاط لتنمية القدرات يهدف إلى تعزيز استقلالية السلطات الوطنية.</span></div>
    </div>`},
    {id:"process", t:"آلية العمل في الإعداد", h:`<ol class="timeline-v">
      <li><b>تحليل واقع التعليم</b> بعد الاتفاق على خارطة الطريق والمبادئ مع الوزارات والمنظمات الدولية الداعمة.</li>
      <li><b>ورشة إلكترونية (أيلول 2020)</b> لمناقشة نتائج التحليل وبدء إعداد شجرتي المشكلات والأهداف.</li>
      <li><b>نقاشات قطاعية (تشرين الأول 2020 – كانون الثاني 2021)</b> لتحديد اتجاهات السياسة والبرامج ذات الأولوية.</li>
      <li><b>مسودة المجالات</b> لكل قطاع بما يحقق رؤية الوزارة المعنية.</li>
      <li><b>ورشة حضورية (شباط 2021)</b> لمواءمة التعليم العام والمهني والعالي.</li>
      <li><b>نموذج المحاكاة ومذكرة السياسات (تموز 2021)</b> لتحديد الأهداف وتقدير الكلفة.</li>
      <li><b>ورشة أربيل (12–16 أيلول 2021)</b> لاعتماد السيناريو الثالث وإنجاز مصفوفة النتائج.</li>
    </ol>
    <p class="prose" style="margin-top:10px">كلّفت اليونسكو بالتنسيق بين الأطراف، وخصص البنك الدولي فريق خبراء لكل قطاع بإشراف المعهد الدولي للتخطيط التربوي.</p>`},
    {id:"lessons", t:"الدروس المستفادة", h:`<ul class="checks">
      <li>الاستقرار السياسي والأمني والإداري من أهم متطلبات التنفيذ.</li>
      <li>التخطيط السليم للموارد والتمويل، وتنويع المصادر بدلاً من الاعتماد على التمويل الحكومي وحده، والاعتماد على الموازنات التشغيلية قدر الإمكان.</li>
      <li>تضمين سيناريوهات تخطيطية وخطط طوارئ مرنة.</li>
      <li>فريق عمل مشترك بين الوزارات للتخطيط التنفيذي والإشراف والمتابعة.</li>
      <li>إعادة النظر في التشريعات والتعليمات التي قد تعيق التنفيذ.</li>
      <li>واقعية الاستراتيجية وبُعدها عن الطموحات الذاتية.</li>
      <li>تدريب الكوادر المسؤولة عن التنفيذ والإشراف والمتابعة.</li>
    </ul>`}
  ];
}

blocks:{
ch1: H => { const {tbl,barChart,componentTiles} = H; return [
  {id:"adopt", t:"Adoption of the previous strategy", h:`<div class="prose"><p>The National Strategy for Education and Higher Education (2012–2022) was adopted by Council of Ministers Resolution No. 323 of 2012, in its fortieth session on 9/11/2012, as the national reference for the annual plans of the sector ministries. The Prime Minister's Office formed an executive secretariat in November 2013. The strategy comprised 178 projects: 63 for the Ministry of Education and 115 for the Ministry of Higher Education and Scientific Research, plus 11 for international organisations.</p>
    <p>Following the drop in oil prices and the allocation of most of the public budget to liberating areas occupied by ISIS in 2014, the secretariat's work was suspended and many projects were not implemented; the two ministries formed their own technical teams.</p></div>`},
  {id:"components", t:"Components of the previous strategy", h:`<p class="prose" style="margin-bottom:14px">The strategy team implemented six components covering the general and institutional context, legislation, quality of education, scientific research and sector financing: 166 projects serving 71 strategic goals measured by 120 indicators, most of them quantitative.</p>${componentTiles()}<p class="src">Figure 1.1: Institutional context of education in Iraq.</p>`},
  {id:"moe", t:"Main Ministry of Education achievements to 2019", h:tbl(["Indicator","Value"],[
    ["School buildings constructed","3,751 of 25,307 (15%)"],["School buildings repaired","241 of 5,910 (4%)"],["Laboratories and workshops equipped","203 of 565 (36%)"],["Shortage of school buildings","8,093 buildings"],
    ["Net enrolment, primary","Rose from 89% to 94%"],["Net enrolment, intermediate","Rose from 36% to 55%"],["Net enrolment, preparatory","Rose from 19% to 30%"],["Net enrolment, vocational","Fell from 1.5% to 1.1%"],
    ["Training courses for teachers and administrators","11,543 courses, 384,880 participants"],["Teachers obtaining a bachelor's degree","19,368 teachers"]])},
  {id:"mohesr", t:"Higher education indicators 2018/2019", h:tbl(["Indicator","Total"],[["Public universities","35"],["Public colleges","369"],["Departments in public colleges","1,549"],["Private universities","14"],["Gross enrolment rate in higher education","19%"],["Share of females among undergraduate admissions","35%"],["Postgraduate admissions","15,359"],["Published research papers","12,216"]],[1])},
  {id:"rates", t:"Implementation rates of projects and programmes", h:`<p class="prose">According to the follow-up committee report (higher education), the implementation rates of 166 projects and programmes were distributed as follows:</p>
    ${barChart(["0%","<20%","20–40%","40–60%","60–80%","80–<100%","100%"],[{name:"Projects",color:"var(--sage)",data:[39,20,33,25,17,21,11]}],{max:40,step:10,aria:"Distribution of implementation rates",label:i=>[39,20,33,25,17,21,11][i]})}
    <p class="src">Table 1.3 of the strategy. 23% of projects had not started; only 7% were completed.</p>`},
  {id:"challenges", t:"Challenges and lessons learned", h:`<h3>Main challenges</h3><ul>
    <li>Insufficient financial allocations as government revenues fell with the sharp drop in oil prices.</li>
    <li>Difficult security conditions after ISIS occupied several governorates in 2014.</li>
    <li>Weak political and administrative stability and frequent changes in the ministries' senior leadership.</li>
    <li>Large expansion of programmes and projects, some very ambitious and requiring large funding.</li>
    <li>Weak coordination between the two ministries and other government bodies.</li>
    <li>The novelty of the experience as the first comprehensive national education strategy.</li>
    <li>Administrative and legal constraints and complex routine.</li></ul>
    <div class="callout"><b>Lessons learned:</b> political, security and administrative stability is a precondition; diversify funding rather than rely on government funding alone; include scenarios and contingency plans; a cross-ministerial team for planning and follow-up; review obstructive legislation; realistic targets; and train staff responsible for implementation and follow-up.</div>`}
];},
ch2: H => { const {tbl} = H; return [
  {id:"geo", t:"Geographic and constitutional framework", h:`<div class="prose"><p>The 19 governorates of Iraq and the autonomous Kurdistan Region constitute the Republic of Iraq. The 2005 Constitution placed education at the heart of development: Article 34 states that education is a basic factor for the progress of society and a right guaranteed by the State, compulsory at the primary stage and free at all stages, with the State combating illiteracy and encouraging scientific research. Iraq's Vision for Sustainable Development 2030 made a good-quality, comprehensive education system a national priority.</p></div>`},
  {id:"econ", t:"Economic framework", h:`<div class="stats">
      <div class="stat"><b>~50%</b><span>of GDP from oil, and more than 90% of government revenue</span></div>
      <div class="stat"><b>43%</b><span>of jobs are in the public sector (about 4 million employees)</span></div>
      <div class="stat"><b>16.6%</b><span>youth unemployment, ages 15–24 (8.9% overall, UNDP 2020)</span></div>
      <div class="stat"><b>0.04%</b><span>of GDP spent on R&amp;D in 2017, against a 2.23% global average</span></div>
    </div><p class="src">GDP at current prices fell from IQD 277.9 trillion (2019) to IQD 198.8 trillion (2020).</p>`},
  {id:"pop", t:"Population and social context", h:tbl(["Indicator","Value"],[["Population (MoP projection, 2020)","40.2 million"],["Urban population","69%"],["Annual population growth 2015–2020","2.5%"],["Population under 15","38%"],["Projected population 2030","More than 51 million"],["Population aged 4–24","From 18 million (2017) to 25 million (2030)"],["Human Development Index rank","120 (0.689)"],["Average years of education","7.3 (6 for girls, 8.6 for boys)"],["Economically active women (15+)","12.4%"]]) + `<p class="src">The last full population census was conducted in 1997.</p>`},
  {id:"hum", t:"Security and humanitarian context", h:`<div class="prose"><p>Half of all school buildings were destroyed or damaged in the governorates ISIS controlled, and 101,980 students were displaced from 84 public colleges and educational institutions. As of April 2020, about 1.4 million people were internally displaced and 4.7 million had returned. The Education Cluster estimates 775,000 Iraqi children inside and outside camps and 98,000 Syrian refugee children.</p>
    <p>COVID-19 closed schools and universities from March 2020 and highlighted the need to use ICT in education. Iraq is also highly exposed to climate change, including drought and floods.</p></div>`}
];},
ch3: H => { const {tbl} = H; return [
  {id:"snap", t:"Snapshot of the education system", h:tbl(["","Pre-primary (4–5)","Primary (6–11)","Secondary (12–17)","University (18–24)"],[["Schools / institutions","719","14,901","6,630","35"],["Teachers","5,952","271,597","153,506","42,907"],["Students","202,937","6,197,870","2,910,816","743,825"],["School-aged population (2031)","2.7 million","7.2 million","6.2 million","3.6 million"]],[1,2,3,4]) + `<p class="src">Table 3.1, Central Statistical Organization 2017/2018.</p>
    <div class="callout"><b>A learning crisis:</b> a child in Iraq can expect to complete only 6.9 years of schooling by age 18, equal to 4.0 learning-adjusted years, with a projected loss of 0.9 years due to COVID-19 school closures (World Bank 2021).</div>`},
  {id:"enrol", t:"Enrolment analysis", h:tbl(["Level","Iraq","Kuwait","Jordan","Saudi Arabia","Egypt"],[["Pre-primary","11","62","27","21","29"],["Primary","121","92","81","100","106"],["Secondary","67","98","63","118","88"],["Higher education (undergraduate)","22","55","33","71","39"]],[1,2,3,4,5]) + `<p class="src">Gross enrolment rates (%), 2017, Table 3.2.</p>
    <ul><li>Primary completion is 82% despite being compulsory; preparatory completion is 38% (2017/18).</li>
    <li>Repetition: 13.9% primary, 27% intermediate, 20.6% preparatory, against a national target of 3%. It peaks at 25% in grade 5, 41% in grade 9 and 37% in grade 12.</li>
    <li>2,039,436 children aged 6–17 are out of school, one third of them girls (MICS 2018).</li>
    <li>Vocational education: about 50,000 students in 314 vocational schools (GER 2.1%), doubling to more than 109,000 in 2020/21. Girls are 24% (30% in 2021).</li>
    <li>Gender parity index of 0.78 at intermediate level and 0.94 at preparatory level.</li></ul>`},
  {id:"quality", t:"Educational quality", h:`<div class="stats">
      <div class="stat"><b>51%</b><span>of primary and secondary schools have their own building</span></div>
      <div class="stat"><b>8,147</b><span>school buildings short in 2017/18; 15.5% destroyed or damaged</span></div>
      <div class="stat"><b>137 / 151</b><span>school days in primary and secondary, the shortest in the region</span></div>
      <div class="stat"><b>303</b><span>days of school closure between February 2020 and May 2021</span></div>
    </div>
    <ul style="margin-top:14px"><li>19% of schools lack drinking water, 27% lack sanitation, and only 8% of primary schools have a computer lab.</li>
    <li>About 28% of kindergarten teachers and 17% of primary teachers do not meet minimum qualification requirements.</li>
    <li>In vocational schools, 47% of teachers are qualified below bachelor's level, only 14% of schools have internet, and programmes are not competency-based.</li>
    <li>The 2012 Early Grade Reading Assessment found that 53% of grade 2 students could not answer a single reading comprehension question.</li></ul>`},
  {id:"mgmt", t:"Management of the education system", h:`<ul>
    <li>485,207 teachers and trainers in general education; teacher:class ratios of 1.7:1 in primary and 2.2:1 in secondary indicate wasted resources.</li>
    <li>28% of education staff are non-teaching, reaching 52% in Ninewa. Half of about 45,000 higher education staff are non-teaching.</li>
    <li>Staff of the ministries of education and higher education rose from 250,000 to 772,000 between 2015 and 2019 (187%).</li>
    <li>More than 1,500 schools were trained in school-based management by 2021; schools assess themselves against 25 standards.</li></ul>`}
];},
ch4: H => { const {overviewFigure} = H; return [
  {id:"vision", t:"Vision and mission", h:`<div class="callout"><b>Vision</b><p style="font-size:19px;margin-top:6px">To aspire to an education system that is committed to values; provides sustainable, innovative, high-quality learning opportunities for all; promotes building a knowledge society; and conforms to global standards.</p></div>
    <div class="callout alt"><b>Mission</b><p style="font-size:17px;margin-top:6px">Strengthen educational institutions for community partnership and build systems that promote scientific and creative thinking, ensure outputs that meet the needs of the labour market, and help build a diversified knowledge economy in line with the requirements of sustainable development.</p></div>
    <p class="prose">The vision considers Iraq's overall socioeconomic development vision; education laws, including compulsory, fee-free basic education; and Iraq's international commitments under Sustainable Development Goal 4.</p>`},
  {id:"values", t:"The twelve core values", h:`<ol class="prose values">
    <li>Belonging and citizenship, leading to global citizenship</li><li>Respect for diversity and acceptance of others</li><li>Justice</li><li>Transparency</li><li>Integrity and impartiality</li><li>Community partnership</li><li>Compatibility with the needs of Iraqi society and sustainable economic development</li><li>Excellence and high-quality service delivery</li><li>Teamwork</li><li>Academic freedom</li><li>Competitiveness</li><li>Lifelong learning and continuous development of those in charge of education services</li></ol>`},
  {id:"dirs", t:"Strategic directions", h:`${overviewFigure("Figure 4.1: Overview of the programmatic strategies")}
    <h3>Key themes across the three sub-sectors</h3>
    <ul><li>Ensuring equitable access to education and training.</li><li>Improving the quality and relevance of education and training and strengthening links with the labour market.</li><li>Improving education governance, including human resource development, planning and management.</li><li>Improving human resource and financial management for better service delivery and greater value for money.</li></ul>
    <p class="prose">Cross-cutting factors include gender, rural–urban divides, children and youth affected by conflict, insecurity and poverty, together with institutionalised crisis-sensitive planning.</p>`}
];},
ch5: H => [
  {id:"intro", t:"How priorities were identified", h:`<div class="prose"><p>Priority programmes are based on a comprehensive sector performance analysis conducted in 2020, followed by sub-sector problem trees that were reversed into solution and objective trees. Each priority programme is a set of sub-programmes serving one objective, and results are measured by outcome- and output-level indicators.</p></div>
    <div class="toc-box">The status of each programme below is updated through the <a href="#/tracking">tracking dashboard</a>.</div>`}
],
ch6: H => { const {tbl,barChart} = H; const yrs = [2022,2023,2024,2025,2026,2027,2028,2029,2030,2031]; return [
  {id:"model", t:"The Iraq Education Simulation Model", h:`<div class="prose"><p>Three quantitative scenarios were prepared: business as usual; implementation of sector policies; and Scenario 3 — adopted — resulting from trade-offs between the ministries of education, higher education and planning, ambitious yet realistic. The model projects the school-aged population to grow by about 27% between 2021 and 2031 to almost 20 million.</p></div>
    ${tbl(["Target","Baseline","Target"],[["GER kindergarten","10.7% (2018/19)","30% (2031)"],["Primary completion","~83%","100% (2025)"],["Intermediate completion","~62%","100% (2028)"],["GER preparatory vocational (M/F)","7% / 3%","14% / 13%"],["Academic preparatory graduates entering university","100%","82%"],["Class size kindergarten / primary","64 / 40","30 / 35"],["Non-formal education participants","~70,000","300,000"]])}`},
  {id:"macro", t:"Macroeconomic framework", h:`<p class="prose">The education budget rises from about IQD 11 trillion in 2019 to about IQD 19 trillion in 2031 — 5.6% of GDP — as education's share of government spending rises from 9.7% to 16%.</p>
    ${barChart(yrs,[{name:"Education budget",color:"var(--sage)",data:[9320,10375,11360,12280,13269,14321,15440,16629,17894,19237]}],{max:20000,step:5000,aria:"Education budget 2022-2031"})}
    <p class="src">Billion IQD, constant 2019 prices. Table 6.2.</p>
    ${tbl(["","2022","2025","2028","2031"],[["Real GDP growth","4.4%","3.2%","3.3%","3.3%"],["Government expenditure % of GDP","32.5%","33.3%","34.2%","35.0%"],["Education % of government expenditure","11.6%","13.0%","14.5%","16.0%"],["Education % of GDP","3.8%","4.3%","5.0%","5.6%"]],[1,2,3,4])}`},
  {id:"cost", t:"Total cost of the strategy", h:`${barChart(yrs,[
      {name:"Higher education",color:"#1f3e31",data:[2732,2710,2762,2854,2966,3084,3195,3303,3415,3531]},
      {name:"Primary",color:"#5e8f6e",data:[5161,5390,5434,5478,5563,5660,5755,5846,5943,6043]},
      {name:"Intermediate",color:"#81935d",data:[2161,2382,2514,2693,2846,2982,3108,3242,3375,3509]},
      {name:"Preparatory academic and vocational",color:"#a9c98a",data:[1847,1777,1888,1952,1977,2012,2053,2104,2142,2153]},
      {name:"Kindergarten and non-formal",color:"#c8b27a",data:[224,318,367,417,470,526,585,649,720,803]}
    ],{max:18000,step:3000,aria:"Total cost by level"})}
    <p class="src">Billion IQD, constant 2019 prices (operational + capital). Total 140,622 billion IQD. Table 6.3.</p>
    <ul><li>Wages dominate: 77% for teachers and 18.7% for non-teaching staff in 2022, the latter falling to 10.8% by 2031.</li>
    <li>Investment rises from 8% to 11% of the total, 13.4 trillion IQD overall, assuming half of new schools are low-cost (80 million IQD per regular classroom, 48 million per low-cost classroom).</li>
    <li>680,780 new teachers are needed — the largest share in primary (301,988) — and 166,627 new classrooms.</li>
    <li>Primary school meals rise from 63.9 to 603 billion IQD a year; higher education scholarships from 15.1 to 122.4 billion.</li></ul>`},
  {id:"gap", t:"Funding gap", h:`${barChart(yrs,[{name:"Operational gap",color:"#b56a4f",data:[1981,1160,606,140,0,0,0,0,0,0]},{name:"Investment gap",color:"#81935d",data:[824,1043,998,974,554,836,755,673,575,457]}],{max:3000,step:500,aria:"Annual funding gap"})}
    <p class="src">Billion IQD, constant 2019 prices. Table 6.12 (2026 investment gap as given in the table total).</p>
    <div class="callout"><b>Almost IQD 12 trillion</b> total funding gap. The operational gap closes by 2026, while 28% of investment expenditure remains unfunded in 2031. Donor support channelled to education through the public sector was USD 34.2 million in 2019, covering only about 2% of the 2022 gap.</div>
    <p class="prose">MoHESR updated its estimates to IQD 45.6 trillion for 2022–2031 (41.6 trillion operational and 4.0 trillion capital).</p>`}

ch7: H => { const {tbl} = H; return [
  {id:"plans", t:"Operational plans", h:`<div class="prose"><p>The strategy is a ten-year framework that does not describe detailed activities. A multi-year operational plan will specify, for each programme, key activities, responsible entities, timeframe, implementation cost, verification indicators and targeted results for each sub-sector.</p></div>`},
  {id:"roles", t:"Implementation and M&E mechanism", h:`<div class="govern">
    <div class="gov-row"><div class="lvl">Highest level</div><div class="boxes"><div class="box"><b>Higher committee overseeing implementation</b>Chaired by the Deputy Prime Minister, with the ministers of education, higher education, finance, planning, and labour and social affairs.</div></div></div>
    <div class="gov-row"><div class="lvl">Central level</div><div class="boxes"><div class="box"><b>Higher Committee of M&amp;E</b>One per ministry, chaired by the minister; reviews progress reports and coordinates with ministries and donors.</div><div class="box"><b>Technical Committee of M&amp;E</b>Chaired by the Deputy Minister for Technical Affairs, with the Director General of Planning as rapporteur; leads operational plans, the annual statistical report and annual review conferences.</div></div></div>
    <div class="gov-row"><div class="lvl">Governorates and universities</div><div class="boxes"><div class="box"><b>Technical committees in education directorates</b>Supervised by directors of education; planning managers lead local plans, data entry and reporting.</div><div class="box"><b>Technical committees in universities, colleges and technical institutes</b>Implement and monitor higher education results.</div></div></div>
    <div class="gov-row"><div class="lvl">School level</div><div class="boxes"><div class="box"><b>School and training institute administrations</b>Prepare school plans under the school-based management programme and report to district education offices.</div></div></div>
  </div>`},
  {id:"escg", t:"Education Sector Coordination Group", h:`<div class="prose"><p>Established in 2019, the Education Sector Coordination Group is the main body for coordinating partner interventions, aligning donor funds with government budgets and tracking progress against an agreed results framework. It is chaired by the ministries of education and higher education, co-chaired by the European Union and the Prime Minister's Office, and led together with UNESCO and UNICEF; international partners are re-elected every two years. UNICEF has hosted the secretariat since November 2020, with the Ministry of Education expected to take it over. Technical working groups per sub-sector and thematic task forces support the group.</p></div>
    <p style="margin-top:10px"><a class="btn" href="#/partners">View partners and their roles</a></p>`},
  {id:"reviews", t:"Review levels", h:tbl(["","Annual review","Mid-term review","Final review"],[
    ["Objective","Assess annual progress to prepare the next year's operational plan","Review progress and introduce mid-term adjustments","Evaluate implementation and inform the next strategy"],
    ["Timing","Once a year, aligned with budget preparation","Middle of implementation (2026)","Last year of the strategy (2031)"],
    ["Focus","Implementation of the previous year's operational plan","Indicator trends, financial results and suitability of strategies","Successes and challenges over the whole period"],
    ["Expected result","Revised annual or multi-year operational plan","Updated strategy and results framework","Sector analysis and a new education strategy"]])},
  {id:"kpis", t:"Results matrix and KPIs", h:`<div class="prose"><p>A limited set of SMART indicators (specific, measurable, achievable, realistic, time-bound) was selected, linked to the simulation model and to the 2030 Agenda, disaggregated as far as possible by gender and governorate, with attention to learners with special needs and displaced learners.</p></div>
    <p style="margin-top:12px"><a class="btn primary" href="#/tracking">Open the indicators dashboard</a></p>`}
];},
foreword: H => [
  {id:"pm", t:"Foreword by H.E. the Prime Minister", h:`<div class="letter">
    <p>This government, through its ambitious approach, aspires to create an educational system consistent with approved international standards and benefiting from the best practices and global experiences, while preserving authentic Iraqi cultural values and the human values of tolerance and coexistence. Through this system, we seek to achieve a number of goals, most notably providing sustainable, innovative and high-quality education and learning opportunities, promoting the building of a knowledge-based society, and responding to the strategic needs of the country and the needs of the labour market.</p>
    <p>The government programme also looks forward to supporting our educational institutions to strengthen community partnership and build systems that promote scientific and creative thinking and ensure the quality of education outputs, contributing to a knowledge-based and diversified economy in line with the requirements of sustainable development plans.</p>
    <p>The quality education we aspire to will be the mainstay and the means to achieve the Sustainable Development Goals endorsed by the United Nations for 2030, preparing a generation of capable young talents able to lead comprehensive national development. The government will directly supervise the implementation of this national strategy, as stated in the fourteenth item of the government programme, through the sector ministries, a central committee under our supervision and sector work teams. The government is also keen to provide the necessary budget to implement this strategy, with continued monitoring and evaluation to find out what has been achieved and address shortcomings during implementation, overcoming difficulties and challenges through effective and practical mechanisms in accordance with the plan.</p>
    <p>We thank those who prepared this strategy from the participating sector ministries, experts and supporting international organisations, and we look forward to more dedication and sincerity in work.</p>
    <p>May God bless all the efforts that accomplished this noble and ambitious work.</p>
    <div class="sign"><b>Engineer Mohamed Shiaa Al-Sudani</b><span>Prime Minister of the Republic of Iraq</span><span>Baghdad – Iraq</span></div>
  </div>`}
],
thanks: H => [
  {id:"ack", t:"Acknowledgement", h:`<div class="letter">
    <p>The Supreme Committee supervising the development of this strategy, the Prime Minister's Advisory Commission and the Higher Committee for Education Development in Iraq extend their gratitude to everyone who contributed to this work, from the Prime Minister's Office to the relevant ministries (Education, Higher Education and Scientific Research, Planning, and Finance), as well as the working groups and technical committees formed by the Supreme Committee. Thanks are also extended to the international organisations that contributed to and funded this achievement, in particular UNESCO, the International Institute for Educational Planning, the World Bank and UNICEF, and to the international experts who helped transfer international best practice.</p>
    <p>We pray that our national government will be able to implement its ambitious programme, which in its fourteenth theme clearly emphasised the direct supervision of the implementation of this strategy.</p>
    <div class="sign"><b>Committee of Prime Minister Decree No. 343</b><span>Supervising the development of the National Education Strategy</span></div>
  </div>`},
  {id:"committees", t:"Committees and working groups", h:`<div class="prose"><p>The Supreme Committee was formed under Cabinet Order 343 issued by the Prime Minister's Office on 24/10/2018, headed by Prof. Dr. Hamid Khalaf Ahmed, Vice Chairman of the Prime Minister's Advisory Commission, with representatives of the ministries of higher education, education, planning and finance, and the Director of the Office of Education and Culture at the Commission as member and coordinator. The strategy drafting team was formed under Administrative Order No. 36 of 2019, and MoHESR formed a 46-member higher education strategy review committee organised in six specialised teams.</p></div><p style="margin-top:12px"><a class="btn" href="#/partners">View partners and their roles</a></p>`}
],

  {id:"list", t:"List of abbreviations", h: H.tbl(["Abbreviation","Term"],[["GDP","Gross domestic product"],["GER","Gross enrolment rate"],["IMF","International Monetary Fund"],["INES","Iraq National Education Strategy"],["ISIS","Islamic State in Iraq and Syria"],["KPI","Key performance indicator"],["M&E","Monitoring and evaluation"],["MoE","Ministry of Education"],["MoHESR","Ministry of Higher Education and Scientific Research"],["MoLSA","Ministry of Labour and Social Affairs"],["MoP","Ministry of Planning"],["SDG","Sustainable Development Goal"],["TVET","Technical and vocational education and training"],["TVQF","Technical and Vocational Qualifications Framework"],["UNESCO","United Nations Educational, Scientific and Cultural Organization"],["UNICEF","United Nations Children's Fund"],["WB","World Bank"]]).replace(/<td class="">([A-Z&amp;;o]+)<\/td>/g,'<td class=""><b class="abbr">$1</b></td>')}

summary: H => [
  {id:"purpose", t:"Purpose and structure", h:`<div class="prose"><p>This document reflects on current education sector challenges in Iraq and presents a way forward. Chapter 1 introduces the purpose of the strategy and its development process; Chapter 2 presents the context; Chapter 3 analyses the education sector; Chapter 4 outlines the vision, mission and core values; Chapter 5 describes sector priorities and key programmes; Chapter 6 sets out the cost and financing framework; and Chapter 7 outlines the M&amp;E, coordination and implementation framework.</p>
    <p>The strategy forms part of a government-wide effort to improve the quality and efficiency of public services for all Iraqis, and was formulated considering the overall socioeconomic development vision, education laws including compulsory fee-free basic education, and international commitments under SDG 4.</p></div>`},
  {id:"vm", t:"Vision, mission and goals", h:`<div class="callout"><b>Vision:</b> To aspire to an education system that is committed to values; provides sustainable, innovative, high-quality learning opportunities for all; promotes building a knowledge society; and conforms to global standards.</div>
    <div class="callout alt"><b>Mission:</b> Strengthen educational institutions for community partnership and build systems that promote scientific and creative thinking, ensure the quality of outputs to meet labour market needs, and help build a diversified knowledge economy in line with sustainable development.</div>
    ${H.overviewFigure("Figure ES1: Overview of the programmatic strategies")}`},
  {id:"assump", t:"Assumptions and projections", h:`<div class="prose"><p><b>Gradual improvement dependent on reforms:</b> critical reforms were projected to start in 2022, with gradual improvement over the first five years, since regulatory and policy frameworks must be in place before enrolment, repetition and retention improve. Teacher recruitment and allocation and infrastructure spending are addressed in the initial phase (2022–2025).</p>
    <p><b>Macroeconomic projections:</b> average GDP growth of 3.3% to 2031; government expenditure remaining at about 35% of GDP; and education's share of government spending rising from almost 10% to 16% by 2031. Public spending on education therefore rises from about IQD 11 trillion in 2019 to IQD 19 trillion in 2031 (constant 2019 prices), 5.6% of GDP.</p></div>`},
  {id:"targets", t:"Key education targets", h:`<ul class="checks">
    <li>Raise kindergarten GER from 10.7% (2018/19) to 30% by 2031, with private provision rising to 25%.</li>
    <li>Raise primary completion to 100% by 2025 from about 83%, and intermediate completion to 100% by 2028 from about 62%.</li>
    <li>Raise preparatory academic GER from 47% to 68% for boys and from 46% to 66% for girls by 2031.</li>
    <li>Expand preparatory vocational education from 7% / 3% to 14% / 13% (boys/girls) by 2031.</li>
    <li>Controlled expansion of higher education: 82% of academic and 50% of vocational preparatory graduates entering by 2031, keeping private provision at 25%.</li>
    <li>Reduce class sizes from 64 to 30 in kindergarten and from 40 to 35 in primary.</li>
    <li>Increase non-formal education participants from about 70,000 to 300,000.</li>
    <li>School meals for all public primary pupils by 2030, school grants for all public schools from 2022, textbooks, and scholarships for 2% of preparatory and 5% of higher education students.</li></ul>`},
  {id:"cost", t:"Cost and funding gap", h:`<div class="stats">
      <div class="stat"><b class="num">~140 trillion</b><span>IQD total cost (constant 2019 prices)</span></div>
      <div class="stat"><b class="num">7% → 10%</b><span>rise in the investment share of education spending between 2022 and 2031</span></div>
      <div class="stat"><b class="num">~12 trillion</b><span>IQD total funding gap</span></div>
      <div class="stat"><b class="num">2026</b><span>operational funding gap closed; 28% of investment remains unfunded in 2031</span></div>
    </div><p class="prose" style="margin-top:14px">The largest cost increases are in pre-primary and vocational education, reflecting planned expansion; major efforts are needed to close the investment gap.</p>`}
],
intro: H => [
  {id:"why", t:"Education as a pillar of development", h:`<div class="prose"><p>This document outlines the government of Iraq's vision for its education sector. Education is one of the three basic pillars of human development, with health and the economy, and a fundamental pillar of the knowledge economy. It is the fourth of the 17 Sustainable Development Goals, and the others can be attained only if it is achieved; "human development through education" ranked first of five pillars in Iraq's priorities for the 2030 SDGs, alongside good governance, a diversified economy, a safe society and a sustainable environment.</p></div>`},
  {id:"path", t:"From the first strategy to the current one", h:`<div class="steps">
    <div class="step"><b class="num">2009</b><span>Preparation of the first national education strategy begins with UNESCO, UNICEF and the World Bank; it took about three years.</span></div>
    <div class="step"><b class="num">2012</b><span>Approved by Cabinet Resolution No. 323 and launched in December 2012, with 178 projects.</span></div>
    <div class="step"><b class="num">2013–2014</b><span>An executive secretariat is formed, then suspended due to the security and financial situation; the ministries form their own technical teams.</span></div>
    <div class="step"><b class="num">2018</b><span>Order 343 forms a committee headed by the Advisory Commission to evaluate the previous strategy and prepare a new ten-year strategy.</span></div>
  </div>
  <div class="prose" style="margin-top:14px"><p>The strategy takes into account the government's goals of strengthening national identity and decentralisation, advancing the private sector, addressing unemployment, linking curricula to labour market needs, developing private education, keeping pace with ICT, addressing the educational and intellectual legacy of ISIS, and improving Iraq's financial condition.</p></div>`},
  {id:"principles", t:"Four preparation principles", h:`<div class="principles">
    <div class="pr"><b>National leadership</b><span>National authorities lead the preparation and hold main responsibility for its success, coordinated by the Higher Committee and supported by national and international experts.</span></div>
    <div class="pr"><b>Participation</b><span>A participatory process ensuring stakeholders are consulted and their views considered.</span></div>
    <div class="pr"><b>Clear roles</b><span>Clear responsibilities for all stakeholders, effective consultation mechanisms and clarity on final decision-making authority.</span></div>
    <div class="pr"><b>Capacity development</b><span>Technical support is a capacity development activity aimed at increasing the autonomy of national authorities.</span></div>
  </div>`},
  {id:"process", t:"How the strategy was prepared", h:`<ol class="timeline-v">
    <li><b>Education situation analysis</b> after agreeing the roadmap and principles with the ministries and supporting international organisations.</li>
    <li><b>Online workshop (September 2020)</b> to discuss the analysis and start problem and objective trees.</li>
    <li><b>Sector discussions (October 2020 – January 2021)</b> to identify policy directions and priority programmes.</li>
    <li><b>Draft pillars</b> for each sector to achieve the vision of the ministry concerned.</li>
    <li><b>Face-to-face workshop (February 2021)</b> to align general education, TVET and higher education.</li>
    <li><b>Simulation model and policy note (July 2021)</b> to set targets and cost the strategy.</li>
    <li><b>Erbil workshop (12–16 September 2021)</b> adopting Scenario 3 and finalising the results matrix.</li>
  </ol>
  <p class="prose" style="margin-top:10px">UNESCO was tasked with coordinating between the parties, and the World Bank assigned a team of experts for each sector under the supervision of the International Institute for Educational Planning.</p>`},
  {id:"lessons", t:"Lessons learned", h:`<ul class="checks">
    <li>Political, security and administrative stability is among the most important requirements for implementation.</li>
    <li>Proper planning of resources and financing; diverse funding sources rather than government funding alone; reliance on operating budgets where possible.</li>
    <li>Planning scenarios and flexible contingency plans.</li>
    <li>A cross-ministerial team specialised in implementation planning, supervision and follow-up.</li>
    <li>Reconsider legislation and instructions that may stand in the way of implementation.</li>
    <li>A realistic strategy, free of subjective ambitions.</li>
    <li>Training of staff responsible for implementation, supervision and follow-up.</li></ul>`}
]
},
