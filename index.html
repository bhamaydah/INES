  {id:"adopt", t:"پەسەندکردنی ستراتیژیی پێشوو", h:`<div class="prose"><p>ستراتیژی نیشتمانیی پەروەردە و خوێندنی باڵا (2012–2022) بە بڕیاری ئەنجومەنی وەزیران ژمارە (323)ی ساڵی 2012 لە دانیشتنی چلەمیدا لە 9/11/2012 پەسەند کرا، وەک سەرچاوەیەکی نیشتمانی بۆ ئامادەکردنی پلانە ساڵانەکانی وەزارەتەکان. نووسینگەی سەرۆک وەزیران لە تشرینی دووەمی 2013 سکرتاریەتێکی جێبەجێکاری پێکهێنا. ستراتیژییەکە 178 پڕۆژەی لەخۆ گرتبوو: 63 بۆ وەزارەتی پەروەردە و 115 بۆ وەزارەتی خوێندنی باڵا و توێژینەوەی زانستی، لەگەڵ 11 پڕۆژە بۆ ڕێکخراوە نێودەوڵەتییەکان.</p>
    <p>بەهۆی دابەزینی نرخی نەوت و تەرخانکردنی زۆربەی بودجەی گشتی بۆ ڕزگارکردنی ناوچە داگیرکراوەکان لەلایەن داعشەوە لە 2014، کاری سکرتاریەتەکە ڕاگیرا و زۆرێک لە پڕۆژەکان جێبەجێ نەکران؛ هەردوو وەزارەت تیمی تەکنیکیی خۆیان پێکهێنا.</p></div>`},
  {id:"components", t:"پێکهاتەکانی ستراتیژیی پێشوو", h:`<p class="prose" style="margin-bottom:14px">تیمی ستراتیژی شەش پێکهاتەی جێبەجێ کرد کە چوارچێوەی گشتی و دامەزراوەیی، یاساکان، کوالیتیی پەروەردە، توێژینەوەی زانستی و داراییی کەرتەکە دەگرێتەوە: 166 پڕۆژە بۆ 71 ئامانجی ستراتیژی کە بە 120 پێوەر دەپێورێن، زۆربەیان چەندایەتی.</p>${componentTiles()}<p class="src">وێنەی 1.1: چوارچێوەی دامەزراوەیی پەروەردە لە عێراق.</p>`},
  {id:"moe", t:"گرنگترین دەستکەوتەکانی وەزارەتی پەروەردە تا 2019", h:tbl(["پێوەر","بەها"],[
    ["بینای قوتابخانەی دروستکراو","3,751 لە 25,307 (15%)"],["بینای قوتابخانەی چاککراو","241 لە 5,910 (4%)"],["تاقیگە و وۆرکشۆپی ئامادەکراو","203 لە 565 (36%)"],["کەمیی بینای قوتابخانە","8,093 بینا"],
    ["ڕێژەی خاوێنی وەرگرتن، سەرەتایی","لە 89%ەوە بۆ 94% بەرزبووەوە"],["ڕێژەی خاوێنی وەرگرتن، ناوەندی","لە 36%ەوە بۆ 55% بەرزبووەوە"],["ڕێژەی خاوێنی وەرگرتن، ئامادەیی","لە 19%ەوە بۆ 30% بەرزبووەوە"],["ڕێژەی خاوێنی وەرگرتن، پیشەیی","لە 1.5%ەوە بۆ 1.1% دابەزی"],
    ["خولی ڕاهێنان بۆ مامۆستا و کارگێڕان","11,543 خول، 384,880 بەشداربوو"],["مامۆستایانی بەدەستهێنەری بەکالۆریۆس","19,368 مامۆستا"]])},
  {id:"mohesr", t:"پێوەرەکانی خوێندنی باڵا 2018/2019", h:tbl(["پێوەر","ژمارە"],[["زانکۆی حکومی","35"],["کۆلێژی حکومی","369"],["بەش لە کۆلێژە حکومییەکان","1,549"],["زانکۆی ئەهلی","14"],["ڕێژەی گشتیی وەرگرتن لە خوێندنی باڵا","19%"],["ڕێژەی کچان لە وەرگیراوانی خوێندنی سەرەتایی","35%"],["وەرگیراوانی خوێندنی باڵا","15,359"],["توێژینەوەی زانستیی بڵاوکراوە","12,216"]],[1])},
  {id:"rates", t:"ڕێژەکانی جێبەجێکردنی پڕۆژە و بەرنامەکان", h:`<p class="prose">بەپێی ڕاپۆرتی لیژنەی بەدواداچوون (کەرتی خوێندنی باڵا)، ڕێژەی جێبەجێکردنی 166 پڕۆژە و بەرنامە بەم شێوەیە دابەش بوون:</p>
    ${barChart(["0%","<20%","20–40%","40–60%","60–80%","80–<100%","100%"],[{name:"پڕۆژەکان",color:"var(--sage)",data:[39,20,33,25,17,21,11]}],{max:40,step:10,aria:"دابەشبوونی ڕێژەکانی جێبەجێکردن",label:i=>[39,20,33,25,17,21,11][i]})}
    <p class="src">خشتەی 1.3ی ستراتیژی. 23%ی پڕۆژەکان دەستیان پێنەکرابوو؛ تەنها 7% تەواو بوون.</p>`},
  {id:"challenges", t:"ئاستەنگەکان و وانە وەرگیراوەکان", h:`<h3>گرنگترین ئاستەنگەکان</h3><ul>
    <li>کەمیی تەرخانکردنی دارایی بەهۆی کەمبوونەوەی داهاتی حکومی لەگەڵ دابەزینی توندی نرخی نەوت.</li>
    <li>دۆخی ئەمنیی سەخت دوای داگیرکردنی چەند پارێزگایەک لەلایەن داعشەوە لە 2014.</li>
    <li>لاوازیی سەقامگیریی سیاسی و کارگێڕی و گۆڕانی سەرکردایەتیی باڵای هەردوو وەزارەت.</li>
    <li>فراوانبوونی زۆری بەرنامە و پڕۆژەکان، هەندێکیان زۆر ئامانجبەرز و پێویستیان بە داراییی زۆر بوو.</li>
    <li>لاوازیی هەماهەنگی لە نێوان هەردوو وەزارەت و دامەزراوە حکومییەکانی تر.</li>
    <li>نوێبوونی ئەزموونەکە وەک یەکەم ستراتیژیی نیشتمانیی گشتگیری پەروەردە.</li>
    <li>کۆتوبەندی کارگێڕی و یاسایی و ڕۆتینی ئاڵۆز.</li></ul>
    <div class="callout"><b>وانە وەرگیراوەکان:</b> سەقامگیریی سیاسی و ئەمنی و کارگێڕی مەرجی جێبەجێکردنە؛ فرەچەشنکردنی سەرچاوەکانی دارایی لە جیاتی پشتبەستن تەنها بە داراییی حکومی؛ دانانی سیناریۆ و پلانی فریاکەوتن؛ تیمێکی هاوبەشی نێوان وەزارەتەکان بۆ پلاندانان و بەدواداچوون؛ پێداچوونەوەی ئەو یاسایانەی ڕێگرن؛ ئامانجی واقیعی؛ و ڕاهێنانی ئەو کارمەندانەی بەرپرسی جێبەجێکردن و بەدواداچوونن.</div>`}
];},
ch2: H => { const {tbl} = H; return [
  {id:"geo", t:"چوارچێوەی جوگرافی و دەستووری", h:`<div class="prose"><p>کۆماری عێراق لە 19 پارێزگا و هەرێمی کوردستان پێکدێت. دەستووری 2005 پەروەردەی خستە ناوەندی گەشەپێدانەوە: مادەی (34) دەڵێت پەروەردە هۆکارێکی بنەڕەتیی پێشکەوتنی کۆمەڵگەیە و مافێکە دەوڵەت گەرەنتیی دەکات، لە قۆناغی سەرەتاییدا ناچارییە و لە هەموو قۆناغەکاندا بێبەرامبەرە، لەگەڵ بەرەنگاربوونەوەی نەخوێندەواری و هاندانی توێژینەوەی زانستی. دیدگای عێراق بۆ گەشەپێدانی بەردەوام 2030 سیستەمێکی پەروەردەیی گشتگیر و باشی کردە لەپێشینەیەکی نیشتمانی.</p></div>`},
  {id:"econ", t:"چوارچێوەی ئابووری", h:`<div class="stats">
      <div class="stat"><b>~50%</b><span>ی بەرهەمی ناوخۆ لە نەوتەوەیە، و زیاتر لە 90%ی داهاتی حکومی</span></div>
      <div class="stat"><b>43%</b><span>ی هەلی کار لە کەرتی گشتییە (نزیکەی 4 ملیۆن فەرمانبەر)</span></div>
      <div class="stat"><b>16.6%</b><span>بێکاریی گەنجان، تەمەنی 15–24 (8.9% بە گشتی، UNDP 2020)</span></div>
      <div class="stat"><b>0.04%</b><span>ی بەرهەمی ناوخۆ بۆ توێژینەوە و پەرەپێدان لە 2017، بەرامبەر 2.23%ی جیهانی</span></div>
    </div><p class="src">بەرهەمی ناوخۆ بە نرخی ئێستا لە 277.9 تریلیۆن دینار (2019) بۆ 198.8 تریلیۆن دینار (2020) دابەزی.</p>`},
  {id:"pop", t:"چوارچێوەی دانیشتووان و کۆمەڵایەتی", h:tbl(["پێوەر","بەها"],[["دانیشتووان (پێشبینیی وەزارەتی پلاندانان 2020)","40.2 ملیۆن"],["دانیشتووانی شار","69%"],["گەشەی ساڵانەی دانیشتووان 2015–2020","2.5%"],["خوار تەمەنی 15 ساڵ","38%"],["دانیشتووانی پێشبینیکراو 2030","زیاتر لە 51 ملیۆن"],["تەمەنی 4–24 ساڵ","لە 18 ملیۆن (2017) بۆ 25 ملیۆن (2030)"],["پلەی پێوەری گەشەپێدانی مرۆیی","120 (0.689)"],["تێکڕای ساڵانی خوێندن","7.3 (6 بۆ کچان، 8.6 بۆ کوڕان)"],["ژنانی چالاکی ئابووری (15+)","12.4%"]]) + `<p class="src">دوایین سەرژمێریی گشتیی دانیشتووان لە 1997 ئەنجام درا.</p>`},
  {id:"hum", t:"چوارچێوەی ئەمنی و مرۆیی", h:`<div class="prose"><p>نیوەی بیناکانی قوتابخانە لەو پارێزگایانەی داعش کۆنتڕۆڵی کردبوون وێران یان زیانمەند بوون، و 101,980 قوتابی لە 84 کۆلێژ و دامەزراوەی پەروەردەیی حکومی ئاوارە بوون. تا نیسانی 2020 نزیکەی 1.4 ملیۆن کەس ئاوارەی ناوخۆ بوون و 4.7 ملیۆن گەڕانەوە. کلاستەری پەروەردە 775,000 منداڵی عێراقی لە ناو و دەرەوەی کەمپەکان و 98,000 منداڵی پەنابەری سووری خەمڵاندووە.</p>
    <p>کۆرۆنا لە ئازاری 2020ەوە قوتابخانە و زانکۆکانی داخست و پێویستیی بەکارهێنانی تەکنەلۆجیای زانیاری و پەیوەندیی لە پەروەردەدا دەرخست. عێراق هەروەها زۆر ڕووبەڕووی گۆڕانی کەشوهەوا دەبێتەوە، لەوانە وشکەساڵی و لافاو.</p></div>`}
];},
ch3: H => { const {tbl} = H; return [
  {id:"snap", t:"تێڕوانینێک بۆ سیستەمی پەروەردە", h:tbl(["","باخچەی ساوایان (4–5)","سەرەتایی (6–11)","ناوەندی و ئامادەیی (12–17)","زانکۆ (18–24)"],[["قوتابخانە / دامەزراوە","719","14,901","6,630","35"],["مامۆستا","5,952","271,597","153,506","42,907"],["قوتابی","202,937","6,197,870","2,910,816","743,825"],["دانیشتووانی تەمەنی خوێندن (2031)","2.7 ملیۆن","7.2 ملیۆن","6.2 ملیۆن","3.6 ملیۆن"]],[1,2,3,4]) + `<p class="src">خشتەی 3.1، دەستەی ناوەندیی ئامار 2017/2018.</p>
    <div class="callout"><b>قەیرانی فێربوون:</b> منداڵێک لە عێراق چاوەڕوان دەکرێت تا تەمەنی 18 تەنها 6.9 ساڵ خوێندن تەواو بکات، کە بەرامبەرە بە 4.0 ساڵی فێربوونی ڕاستەقینە، لەگەڵ لەدەستدانی پێشبینیکراوی 0.9 ساڵ بەهۆی داخستنی قوتابخانەکان لە کاتی کۆرۆنادا (بانکی نێودەوڵەتی 2021).</div>`},
  {id:"enrol", t:"شیکردنەوەی وەرگرتن", h:tbl(["قۆناغ","عێراق","کوەیت","ئوردن","سعودیە","میسر"],[["پێش سەرەتایی","11","62","27","21","29"],["سەرەتایی","121","92","81","100","106"],["ناوەندی و ئامادەیی","67","98","63","118","88"],["خوێندنی باڵا (سەرەتایی)","22","55","33","71","39"]],[1,2,3,4,5]) + `<p class="src">ڕێژەی گشتیی وەرگرتن (%)، 2017، خشتەی 3.2.</p>
    <ul><li>ڕێژەی تەواوکردنی سەرەتایی 82%ە سەرەڕای ناچاربوونی؛ تەواوکردنی ئامادەیی 38%ە (2017/18).</li>
    <li>دووبارەکردنەوەی پۆل: 13.9% سەرەتایی، 27% ناوەندی، 20.6% ئامادەیی، بەرامبەر ئامانجی نیشتمانیی 3%. لە پۆلی پێنجەم دەگاتە 25%، لە پۆلی نۆیەم 41% و لە پۆلی دوازدەیەم 37%.</li>
    <li>2,039,436 منداڵی تەمەن 6–17 لە دەرەوەی قوتابخانەن، سێیەکیان کچن (MICS 2018).</li>
    <li>پەروەردەی پیشەیی: نزیکەی 50,000 قوتابی لە 314 قوتابخانەی پیشەیی (ڕێژەی وەرگرتن 2.1%)، کە لە 2020/21 دووهێندە بوو بۆ زیاتر لە 109,000. کچان 24%ن (30% لە 2021).</li>
    <li>پێوەری یەکسانیی ڕەگەزی 0.78 لە ناوەندی و 0.94 لە ئامادەیی.</li></ul>`},
  {id:"quality", t:"کوالیتیی پەروەردە", h:`<div class="stats">
      <div class="stat"><b>51%</b><span>ی قوتابخانە سەرەتایی و ناوەندییەکان بینای تایبەتی خۆیان هەیە</span></div>
      <div class="stat"><b>8,147</b><span>بینای قوتابخانە کەمە لە 2017/18؛ 15.5% وێران یان زیانمەند بوون</span></div>
      <div class="stat"><b>137 / 151</b><span>ڕۆژی خوێندن لە سەرەتایی و ناوەندی، کورتترین لە ناوچەکەدا</span></div>
      <div class="stat"><b>303</b><span>ڕۆژ داخستنی قوتابخانە لە نێوان شوباتی 2020 و ئایاری 2021</span></div>
    </div>
    <ul style="margin-top:14px"><li>19%ی قوتابخانەکان ئاوی خواردنەوەیان نییە، 27% ئاوەڕۆیان نییە، و تەنها 8%ی قوتابخانە سەرەتاییەکان تاقیگەی کۆمپیوتەریان هەیە.</li>
    <li>نزیکەی 28%ی مامۆستایانی باخچەی ساوایان و 17%ی مامۆستایانی سەرەتایی کەمترین مەرجەکانی شیاوییان نییە.</li>
    <li>لە قوتابخانە پیشەییەکاندا 47%ی مامۆستایان خوار بەکالۆریۆسن، تەنها 14%ی قوتابخانەکان ئینتەرنێتیان هەیە، و بەرنامەکان لەسەر بنەمای کارامەیی نین.</li>
    <li>هەڵسەنگاندنی خوێندنەوەی پۆلە سەرەتاییەکان (2012) دەریخست کە 53%ی قوتابیانی پۆلی دووەم وەڵامی هیچ پرسیارێکی تێگەیشتنیان نەدایەوە.</li></ul>`},
  {id:"mgmt", t:"بەڕێوەبردنی سیستەمی پەروەردە", h:`<ul>
    <li>485,207 مامۆستا و ڕاهێنەر لە پەروەردەی گشتیدا؛ ڕێژەی مامۆستا بۆ پۆل 1.7:1 لە سەرەتایی و 2.2:1 لە ناوەندی بەفیڕۆدانی سەرچاوەکان پیشان دەدات.</li>
    <li>28%ی کارمەندانی پەروەردە ناوانەبێژن، لە نینەوا دەگاتە 52%. نیوەی نزیکەی 45,000 کارمەندی خوێندنی باڵا ناوانەبێژن.</li>
    <li>کارمەندانی هەردوو وەزارەتی پەروەردە و خوێندنی باڵا لە نێوان 2015 و 2019 لە 250 هەزارەوە بۆ 772 هەزار زیادیان کرد (187%).</li>
    <li>تا 2021 زیاتر لە 1,500 قوتابخانە لەسەر بەڕێوەبردنی پشتبەستوو بە قوتابخانە ڕاهێنران؛ قوتابخانەکان خۆیان بە 25 ستاندارد هەڵدەسەنگێنن.</li></ul>`}
];},
ch4: H => { const {overviewFigure} = H; return [
  {id:"vision", t:"دیدگا و پەیام", h:`<div class="callout"><b>دیدگا</b><p style="font-size:19px;margin-top:6px">هەوڵدان بۆ سیستەمێکی پەروەردەیی پابەند بە بەهاکان، کە دەرفەتی فێربوونی بەردەوام و داهێنەرانە و کوالیتی بەرز بۆ هەمووان دابین بکات، بونیادنانی کۆمەڵگەی زانین بەهێز بکات و لەگەڵ ستانداردە جیهانییەکان بگونجێت.</p></div>
    <div class="callout alt"><b>پەیام</b><p style="font-size:17px;margin-top:6px">بەهێزکردنی دامەزراوە پەروەردەییەکان بۆ هاوبەشیی کۆمەڵگە، بونیادنانی سیستەمگەلێک کە بیرکردنەوەی زانستی و داهێنەرانە بەهێز بکەن، کوالیتیی دەرچووان بۆ پڕکردنەوەی پێداویستییەکانی بازاڕی کار مسۆگەر بکەن و بەشداری لە بونیادنانی ئابوورییەکی زانینی فرەچەشن بکەن کە لەگەڵ پێداویستییەکانی گەشەپێدانی بەردەوام بگونجێت.</p></div>

    <p>ئەم حکومەتە لە ڕێگەی بەرنامە ئامانجبەرزەکەیەوە هەوڵ دەدات سیستەمێکی پەروەردە و فێرکردن دروست بکات کە لەگەڵ ستانداردە نێودەوڵەتییە پەسەندکراوەکان بگونجێت و سوود لە باشترین ئەزموونە جیهانییەکان وەربگرێت، لەگەڵ پاراستنی بەها شارستانییە ڕەسەنەکانی عێراق و بەها مرۆییەکانی لێبوردەیی و پێکەوەژیان. لە ڕێگەی ئەم سیستەمەوە هەوڵ دەدەین چەند ئامانجێک بەدی بهێنین کە دیارترینیان دابینکردنی دەرفەتی پەروەردە و فێربوونی بەردەوام و داهێنەرانە و کوالیتی بەرزە، لەگەڵ بەهێزکردنی بونیادنانی کۆمەڵگەی زانین و وەڵامدانەوەی پێداویستییە ستراتیژییەکانی وڵات و بازاڕی کار. بەرنامەی حکومی هەروەها دەیەوێت دامەزراوە پەروەردەییەکانمان بۆ هاوبەشیی کۆمەڵگە بەهێز بکات و سیستەمگەلێک بونیاد بنێت کە بیرکردنەوەی زانستی و داهێنەرانە بەهێز بکەن و کوالیتیی دەرچووانی پەروەردە مسۆگەر بکەن، کە بەشداری لە بونیادنانی ئابوورییەکی زانینی و فرەچەشن دەکەن.</p>
    <p>ئەو پەروەردە باشەی ئێمە ئاواتی بۆ دەخوازین کۆڵەکەی سەرەکی و ئامرازی بەدیهێنانی ئامانجەکانی گەشەپێدانی بەردەوام دەبێت کە نەتەوە یەکگرتووەکان تا 2030 پەسەندی کردوون، بۆ ئامادەکردنی نەوەیەک لە توانا گەنجە کاراکان کە بتوانن سەرکردایەتیی گەشەپێدانی نیشتمانیی گشتگیر بکەن. ئەرکی حکومەت لەسەر سەرپەرشتیی ڕاستەوخۆی جێبەجێکردنی ئەم ستراتیژییە نیشتمانییە چڕ دەبێتەوە، وەک لە بڕگەی چواردەیەمی بەرنامەی حکومیدا هاتووە، لە ڕێگەی وەزارەتە کەرتییەکان و لیژنەیەکی ناوەندی لە ژێر سەرپەرشتیی ئێمە و تیمی کاری کەرتی. حکومەت هەروەها سوورە لەسەر دابینکردنی بودجەی پێویست بۆ جێبەجێکردنی ئەم ستراتیژییە، لەگەڵ بەردەوامبوونی چاودێری و هەڵسەنگاندن بۆ زانینی ئەوەی بەدیهاتووە و چارەسەرکردنی کەموکوڕییەکان لە کاتی جێبەجێکردندا.</p>
    <p>سوپاسی ئامادەکارانی ئەم ستراتیژییە دەکەین لە وەزارەتە بەشداربووەکان و شارەزایان و ڕێکخراوە نێودەوڵەتییە پاڵپشتەکان، و چاوەڕوانی بەخشش و دڵسۆزیی زیاترین لە کاردا.</p>
    <p>خودا بەرەکەت بخاتە هەموو ئەو هەوڵە چاکانەی ئەم کارە بەرز و ئامانجبەرزەیان بەدیهێنا.</p>

  </div>`}

  {id:"ack", t:"سوپاس و پێزانین", h:`<div class="letter">
    <p>لیژنەی باڵای سەرپەرشتیاری ئامادەکردنی ئەم ستراتیژییە، دەستەی ڕاوێژکاران و لیژنەی باڵای پەرەپێدانی پەروەردە لە عێراق سوپاس و پێزانینی خۆیان ئاراستەی هەموو ئەوانە دەکەن کە بەشدارییان لە ئەنجامدانی ئەم کارەدا کرد، لە نووسینگەی سەرۆک وەزیرانەوە تا وەزارەتە پەیوەندیدارەکان (پەروەردە، خوێندنی باڵا و توێژینەوەی زانستی، پلاندانان، و دارایی)، هەروەها تیمەکانی کار و لیژنە تەکنیکییەکانی سەر بە لیژنەی باڵا. سوپاس بۆ ڕێکخراوە نێودەوڵەتییە بەشداربوو و داراییکەرەکان، بە تایبەتی یونسکۆ، پەیمانگەی نێودەوڵەتیی پلاندانانی پەروەردە، بانکی نێودەوڵەتی و یونیسێف، و ئەو شارەزا نێودەوڵەتییانەی بەشدارییان لە گواستنەوەی باشترین ئەزموونە نێودەوڵەتییەکان کرد.</p>
    <p>لە خودا دەپاڕێینەوە کە حکومەتی نیشتمانیمان بتوانێت بەرنامە ئامانجبەرزەکەی جێبەجێ بکات، کە لە تەوەری چواردەیەمیدا بە ڕوونی جەختی لەسەر سەرپەرشتیی ڕاستەوخۆی جێبەجێکردنی ئەم ستراتیژییە کردووە.</p>

  </div>`},
  {id:"committees", t:"لیژنە و تیمەکانی کار", h:`<div class="prose"><p>لیژنەی باڵا بە فەرمانی دیوانی (343) لە نووسینگەی سەرۆک وەزیرانەوە لە 24/10/2018 پێکهێنرا، بە سەرۆکایەتیی پ.د. حامید خەلەف ئەحمەد، جێگری سەرۆکی دەستەی ڕاوێژکاران، و ئەندامێتیی نوێنەرانی وەزارەتەکانی خوێندنی باڵا، پەروەردە، پلاندانان و دارایی، و بەڕێوەبەری نووسینگەی پەروەردە و ڕۆشنبیری لە دەستەی ڕاوێژکاران وەک ئەندام و هەماهەنگکار. تیمی داڕشتنی ستراتیژی بە فەرمانی کارگێڕیی (36)ی ساڵی 2019 پێکهێنرا، و وەزارەتی خوێندنی باڵا لیژنەیەکی 46 ئەندامی بۆ پێداچوونەوەی ستراتیژیی خوێندنی باڵا لە شەش تیمی پسپۆڕدا پێکهێنا.</p></div><p style="margin-top:12px"><a class="btn" href="#/partners">بینینی هاوبەشان و ڕۆڵەکانیان</a></p>`}

  {id:"assump", t:"گریمانە و پێشبینییەکان", h:`<div class="prose"><p><b>باشبوونی قۆناغ بە قۆناغ بەستراو بە چاکسازی:</b> پێشبینی کرابوو چاکسازییە گرنگەکان لە 2022 دەست پێ بکەن، لەگەڵ باشبوونی قۆناغ بە قۆناغ لە پێنج ساڵی یەکەمدا، چونکە پێویستە چوارچێوە ڕێکخستنی و سیاسییەکان جێبەجێ بکرێن پێش ئەوەی وەرگرتن و دووبارەکردنەوە و مانەوە باشتر ببن. دامەزراندن و دابەشکردنی مامۆستایان و خەرجیی ژێرخان لە قۆناغی یەکەمدا (2022–2025) چارەسەر دەکرێن.</p>
    <p><b>پێشبینییە ئابوورییە گشتییەکان:</b> تێکڕای گەشەی بەرهەمی ناوخۆ 3.3% تا 2031؛ مانەوەی خەرجیی حکومی لە نزیکەی 35%ی بەرهەمی ناوخۆ؛ و بەرزبوونەوەی پشکی پەروەردە لە خەرجیی حکومی لە نزیکەی 10%ەوە بۆ 16% تا 2031. بەم پێیە خەرجیی گشتیی پەروەردە لە نزیکەی 11 تریلیۆن دینار لە 2019ەوە بەرز دەبێتەوە بۆ 19 تریلیۆن لە 2031 (نرخی جێگیری 2019)، واتە 5.6%ی بەرهەمی ناوخۆ.</p></div>`},

function tbl(head, rows, numCols=[]){

}
function barChart(years, series, opts){
  const W=760, H=300, L=56, R=16, T=28, B=40;
  const max = opts.max; const iw = W-L-R, ih = H-T-B; const bw = iw/years.length;
  const y = v => T + ih - (v/max)*ih;
  let g = "";
  for(let t=0;t<=max;t+=opts.step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`; }
  years.forEach((yr,i) => {
    const x = L + i*bw; let acc = 0;
    series.forEach(s => { const v = s.data[i]; const y0 = y(acc), y1 = y(acc+v); g += `<rect x="${x+bw*0.18}" y="${y1}" width="${bw*0.64}" height="${Math.max(0,y0-y1)}" fill="${s.color}" rx="2"><title>${yr}: ${fmt(v)}</title></rect>`; acc += v; });
    g += `<text x="${x+bw/2}" y="${y(acc)-7}" text-anchor="middle" class="v">${fmt(opts.label ? opts.label(i) : acc)}</text>`;
    g += `<text x="${x+bw/2}" y="${H-B+20}" text-anchor="middle">${yr}</text>`;
  });
  const legend = series.length>1 ? `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>` : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria)}" direction="ltr">${g}</svg>${legend}</div>`;
}

function route(keepScroll){
  const h = location.hash.replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean);
  listeners.clear();
  let r = "home";
  const DL = docList();
  if(parts[0] === "ch"){ r = "doc"; renderDocPage("ch" + Math.min(7, Math.max(1, parseInt(parts[1]||"1",10)||1))); }
  else if(parts[0] === "doc"){ r = "doc"; if(parts[1] && DL.some(d => d.key === parts[1])) renderDocPage(parts[1]); else renderDocIndex(); }
  else if(parts[0] === "pillar"){ r = "doc"; const k = C.pillars[parts[1]] ? parts[1] : "ge"; const i = Math.min(pillars(k).length-1, Math.max(0, parseInt(parts[2]||"0",10)||0)); renderPillar(k, i); }
  else if(parts[0] === "tracking"){ r = "tracking"; renderTracking(); }
  else if(parts[0] === "partners"){ r = "partners"; renderPartners(); }
  else if(parts[0] === "downloads"){ r = "downloads"; renderDownloads(); }
  else if(parts[0] === "admin"){ r = "admin"; renderAdmin(); }
  else renderHome();
  document.querySelectorAll("#nav a").forEach(a => { if(a.dataset.r === r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(keepScroll !== true) window.scrollTo(0,0);
}

let filt = {g:"all", s:"all", q:"", tab:"kpi"};
function computeSummary(){
  const counts = {not_started:0,on_track:0,at_risk:0,off_track:0,achieved:0}; const bySec = {};
  KPI_GROUPS.forEach(gr => gr.ids.forEach(id => {
    const r = rec(id); const s = r && C.status[r.status] ? r.status : "not_started"; counts[s]++;
    const b = bySec[gr.g] = bySec[gr.g] || {n:0,sum:0,upd:0}; b.n++; b.sum += r && typeof r.progress === "number" ? r.progress : 0; if(r) b.upd++;
  }));
  return {counts, bySec};
}
function trackingSummaryHTML(withLink){
  const s = computeSummary();
  return `<div class="sec-h"><div><div class="eyebrow">${C.ui.navTracking}</div><h2>${C.ui.kpiStatus}</h2></div>${withLink?`<a class="btn primary" href="#/tracking">${C.ui.openTracking}</a>`:""}</div>

    <div class="summary">${STATUS_ORDER.map(k => `<div class="sum"><b class="num" style="color:var(--${STATUS_COLOR[k]})">${s.counts[k]}</b><span>${C.status[k]}</span></div>`).join("")}</div>
    <div class="bysec">${["ge","tv","he","fn"].map(g => { const b = s.bySec[g]||{n:0,sum:0,upd:0}; const avg = b.n ? Math.round(b.sum/b.n) : 0; return `
      <div class="sum"><span class="sum-t">${C.groups[g]}</span><b class="num">${avg}%</b><div class="bar"><i style="width:${avg}%"></i></div><span class="num sum-n">${C.ui.avgProgress(b.upd, b.n)}</span></div>`; }).join("")}</div>`;
}
function passes(g, id, text){
  if(filt.g !== "all" && g !== filt.g) return false;
  const r = rec(id); const s = r && C.status[r.status] ? r.status : "not_started";
  if(filt.s !== "all" && s !== filt.s) return false;
  if(filt.q && !text.toLowerCase().includes(filt.q.toLowerCase())) return false;

}

async function renderAdmin(){
  view.innerHTML = adminShell(`<div class="dlg-b"><p>${A().checking}</p></div>`);
  let me;
  try{ me = await api("me"); }catch(e){ me = {ok:false, status:0}; }
  if(!location.hash.startsWith("#/admin")) return;
  if(me.ok && me.data.user){ session = me.data; return renderTracking("admin"); }
  if(me.status === 401) return renderLogin();
  view.innerHTML = adminShell(`<div class="dlg-b"><p>${A().noApi}</p><a class="btn" href="#/tracking">${C.ui.openTracking}</a></div>`);
}
function renderLogin(){
  view.innerHTML = adminShell(`
    <form id="loginForm" class="dlg-b">
      <label for="lUser">${A().user}<input id="lUser" type="text" autocomplete="username" dir="ltr" required></label>
      <label for="lPass">${A().pass}<input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></label>
      <button class="btn primary" type="submit" id="lBtn">${A().login}</button>
      <span class="err" id="lErr" role="alert"></span>
    </form><p class="src" style="padding:0 22px 20px">${A().loginNote}</p>`);
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#lErr"); $("#lBtn").disabled = true; err.textContent = A().checking;
    try{
      const r = await api("login", {method:"POST", body:{username: $("#lUser").value.trim().toLowerCase(), password: $("#lPass").value}});
      if(r.ok){ session = r.data; return renderTracking("admin"); }
      err.textContent = r.status === 429 ? A().locked : r.status === 401 ? A().badLogin : A().noApi;
    }catch(ex){ err.textContent = A().netErr; }
    $("#lBtn").disabled = false;
  });
}
async function renderUsers(){
  const box = $("#trkList"); if(!box) return;
  box.innerHTML = `<div class="notice"><span>${A().usersNote}</span></div>
    <div class="kpis" id="uList" style="margin-top:14px"><div class="kpi">${A().checking}</div></div>
    <h3 style="color:var(--ink);margin-top:26px">${A().addUser}</h3>
    <form id="uForm" class="dlg-b card-form">
      <div class="row2"><label for="uUser">${A().uUser}<input id="uUser" dir="ltr" required></label><label for="uName">${A().uName}<input id="uName" required></label></div>
      <div class="row2"><label for="uPass">${A().uPass}<input id="uPass" type="password" dir="ltr" autocomplete="new-password" required></label>
      <label for="uRole">${A().uRole}<select id="uRole"><option value="editor">${A().roleEditor}</option><option value="admin">${A().roleAdmin}</option></select></label></div>
      <div><button class="btn primary" type="submit">${A().add}</button> <span class="err" id="uErr" role="alert"></span></div>
    </form>`;
  const msg = code => ({forbidden:A().forbidden, bad_username:A().badUser, bad_password:A().badPass, exists:A().exists, unauthorized:A().expired}[code] || A().saveErr);
  const load = async () => {
    const r = await api("users");
    if(!r.ok){ $("#uList").innerHTML = `<div class="kpi">${msg(r.data.error)}</div>`; return; }
    $("#uList").innerHTML = r.data.users.map(u => `<div class="kpi" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto">
      <div class="name"><b>${esc(u.name)}</b><small dir="ltr">${esc(u.username)}</small></div>
      <div>${statusPill("on_track").replace(C.status.on_track, u.owner ? A().owner : (u.role==="admin" ? A().roleAdmin : A().roleEditor))}</div>
      <div>${u.owner || u.username === session.user ? "" : `<button class="btn sm" data-del="${esc(u.username)}">${A().remove}</button>`}</div></div>`).join("");
  };
  $("#uList").addEventListener("click", async e => {
    const b = e.target.closest("[data-del]"); if(!b) return;
    const r = await api("users/" + encodeURIComponent(b.dataset.del), {method:"DELETE"});
    $("#uErr").textContent = r.ok ? A().removed : msg(r.data.error); if(r.ok) load();
  });
  $("#uForm").addEventListener("submit", async e => {
    e.preventDefault();
    const r = await api("users", {method:"POST", body:{username:$("#uUser").value.trim().toLowerCase(), name:$("#uName").value.trim(), password:$("#uPass").value, role:$("#uRole").value}});
    $("#uErr").textContent = r.ok ? A().added : msg(r.data.error);
    if(r.ok){ e.target.reset(); load(); }
  });
  load();
}

/* editor dialog */
const dlg = document.createElement("dialog"); dlg.id = "dlg"; document.body.appendChild(dlg);
let editing = null;
function openEditor(id, kind){
  const meta = kind === "kpi" ? kpiMeta(id) : progMeta(id); if(!meta) return;
  editing = {id, kind};
  const r = rec(id) || {}; const T = A();
  const hist = Array.isArray(r.history) ? r.history.slice().reverse() : [];
  dlg.setAttribute("dir", C.dir); dlg.setAttribute("lang", C.code);
  dlg.innerHTML = `<form method="dialog">
    <div class="dlg-h"><small>${kind === "kpi" ? T.dlgKpi : T.dlgProg} · ${C.groups[meta.g]}</small><h3 style="font-size:18px;margin-top:4px">${meta.t}</h3></div>
    <div class="dlg-b">
      <div class="row2">
        <label for="fStatus">${T.status}<select id="fStatus">${STATUS_ORDER.map(k => `<option value="${k}" ${ (C.status[r.status] ? r.status : "not_started") === k ? "selected" : ""}>${C.status[k]}</option>`).join("")}</select></label>
        <label for="fProgress">${T.progress}<input id="fProgress" type="number" min="0" max="100" step="1" inputmode="numeric" value="${typeof r.progress === "number" ? r.progress : ""}"></label>
      </div>
      ${kind === "kpi" ? `<div class="row2">
        <label for="fValue">${T.value}<input id="fValue" type="text" placeholder="${esc(T.valuePh)}" value="${esc(r.value||"")}"></label>
        <label for="fYear">${T.year}<input id="fYear" type="text" placeholder="${esc(T.yearPh)}" value="${esc(r.year||"")}"></label>
      </div>` : ""}
      <label for="fNote">${T.note}<textarea id="fNote" placeholder="${esc(T.notePh)}">${esc(r.note||"")}</textarea></label>
      <div class="hist">${hist.length ? `<b>${T.history}</b><ul>${hist.map(h => `<li>${when(h.at)} · ${esc(h.by||"")} — ${C.status[h.status]||""}${typeof h.progress==="number"?` · ${h.progress}%`:""}${h.value?` · ${esc(h.value)}`:""}</li>`).join("")}</ul>` : T.noHistory}</div>
    </div>
    <div class="dlg-f">
      <button class="btn primary" id="dlgSave" type="button">${T.save}</button>
      <button class="btn" value="cancel" type="submit">${T.cancel}</button>
      <span class="err" id="dlgErr" role="alert"></span>
    </div></form>`;
  $("#dlgSave", dlg).addEventListener("click", saveEditor);
  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open","");
}
async function saveEditor(){
  const T = A(); const raw = $("#fProgress", dlg).value;
  if(raw !== "" && !(Number(raw) >= 0 && Number(raw) <= 100)){ $("#dlgErr", dlg).textContent = T.badProgress; return; }
  const body = {id: editing.id, status: $("#fStatus", dlg).value, progress: raw === "" ? null : Math.round(Number(raw)),
    value: editing.kind === "kpi" ? $("#fValue", dlg).value.trim() : "", year: editing.kind === "kpi" ? $("#fYear", dlg).value.trim() : "", note: $("#fNote", dlg).value.trim()};
  $("#dlgSave", dlg).disabled = true; $("#dlgErr", dlg).textContent = T.saving;
  try{
    const r = await api("tracking", {method:"PUT", body});
    if(r.ok){ track[editing.id] = r.data.record; dataDate = r.data.exportedAt || dataDate; dlg.close(); editing = null; notify(); return; }
    if(r.status === 401){ dlg.close(); session = null; renderLogin(); $("#lErr").textContent = T.expired; return; }
    $("#dlgErr", dlg).textContent = T.saveErr;
  }catch(e){ $("#dlgErr", dlg).textContent = T.netErr; }
  $("#dlgSave", dlg).disabled = false;
}

applyLang();
route();
})();

</script>
